<!DOCTYPE html>
<html lang="en">

<title>Marsh Raid</title>
<style>

  .area:hover { transform: translateY(-2px); border-color: #3b5a44; } .area:active { transform: translateY(1px); }
  .area .ic { font-size: 30px; } .area b { font-size: 17px; letter-spacing: 1px; } .area small { color: #9ab; }

  .gitem .gl { position: absolute; left: 3px; top: 2px; right: 3px; font-size: 10px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .gitem.ghost { opacity: 0.85; box-shadow: 0 8px 24px #000c; }
  .gcell-hl { position: absolute; pointer-events: none; border-radius: 4px; }
  .eslot { position: relative; display: inline-flex; align-items: center; justify-content: center; background: #0f1712; border: 2px dashed #3b5a44; border-radius: 6px; margin: 4px; vertical-align: top; } .eslot.has { border-style: solid; }
  .eslot .sl { color: #5a7a64; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; text-align: center; }
  .eq { display: flex; flex-wrap: wrap; gap: 2px; align-items: flex-start; }
  .imenu { position: fixed; z-index: 1001; background: #1f2a24; border: 2px solid #0d1410; border-radius: 8px; padding: 4px; display: flex; flex-direction: column; min-width: 150px; box-shadow: 0 8px 24px #000c; }
  .imenu button { background: none; border: none; color: #fff; text-align: left; padding: 8px 10px; font-size: 13px; font-family: inherit; cursor: pointer; border-radius: 6px; } .imenu button:hover { background: #3b5a44; }
  .bar { height: 10px; background: #0d1410; border-radius: 5px; overflow: hidden; margin: 4px 0; } .bar i { display: block; height: 100%; }
  .fcard { background: #16201a; border-left: 6px solid; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .stance { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; } .stance .b.on { outline: 2px solid #f2d84a; }
  .two { display: flex; gap: 14px; } .two > div { flex: 1; min-width: 0; display: flex; flex-direction: column; max-height: 60vh; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0; font-size: 13px; color: #9ab; } .stats b { color: #fff; font-size: 16px; margin-left: 4px; }
  .res .list { max-height: 30vh; }
  footer { font-size: 12px; text-align: center; }
  @media (max-width: 1000px) {
    .tabs { display: flex; }
    .cols section { display: none; } .cols section.on { display: flex; }
    .body { flex-direction: column; min-height: auto; } .body > section, .body > section.grow { flex: 0 0 auto; max-height: none; overflow: visible; width: auto !important; } .body > section > div[style*='overflow'] { overflow-x: auto; } .scr { overflow: auto; }
    .hub { padding: 8px; } h1 { font-size: 20px; } .hub .meta { font-size: 12px; gap: 10px; }
    .two { flex-direction: column; } .two > div { max-height: 34vh; }
    footer { display: none; }
  }
</style>

<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script>
// ===== 00_util.js =====
'use strict';
// ---------- utilities ----------
const TILE = 48;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const angleDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let rng = Math.random;
const rand = (a = 1, b) => (b === undefined ? rng() * a : a + rng() * (b - a));
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];
const chance = p => rng() < p;
function weightedPick(table) { let tot = 0; for (const e of table) tot += e[1]; let r = rng() * tot; for (const e of table) { r -= e[1]; if (r <= 0) return e[0]; } return table[table.length - 1][0]; }
function fmtTime(s) { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function fmtMoney(n) { return '₵' + Math.round(n).toLocaleString('en-US'); }
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ===== 01_factions.js =====
// ---------- factions, hideout upgrades, crafting, weather ----------
const FACTIONS = {
  scavs: { name: 'Marsh Scavs', short: 'Scavs', col: '#8a8a7a', types: ['scav'], startRep: 0,
    desc: 'Loose gangs of looters. Cheap to befriend, quick to forget.', merchant: 'Rook', greet: 'Got anything shiny? No? Then why are we talking.',
    stock: [['ammo_9', 0], ['bandage', 0], ['shotgun', 10], ['painkiller', 10], ['bag_small', 20], ['key_reedbanks', 30]] },
  flock: { name: 'The Flock', short: 'Flock', col: '#5a7a5a', types: ['guard'], startRep: -5,
    desc: 'Disciplined militia. They hold the villages and shoot looters on sight.', merchant: 'Sergeant Pintail', greet: 'Prove you are not a scav and we might talk.',
    stock: [['ammo_556', 0], ['vest_light', 10], ['medkit', 15], ['rifle', 25], ['key_oldmill', 35]] },
  crew: { name: "Drake's Crew", short: 'Crew', col: '#8a3a3a', types: ['crew', 'boss'], startRep: -20,
    desc: 'The Drake’s smugglers. They run the Depot and everything that passes through it.', merchant: 'Mallory', greet: 'The Drake does not forgive. He does, however, sell.',
    stock: [['ammo_762', 0], ['smg', 10], ['ammo_12', 10], ['vest_heavy', 25], ['dmr', 40], ['key_depot', 45]] },
};
const FACTION_IDS = Object.keys(FACTIONS);
function repLabel(r) { return r >= 40 ? 'Trusted' : r >= 15 ? 'Friendly' : r >= 0 ? 'Neutral' : r >= -20 ? 'Disliked' : 'Hunted'; }
function factionOf(type) { for (const f of FACTION_IDS) if (FACTIONS[f].types.includes(type)) return f; return 'scavs'; }
// per-map roster: how many of each faction spawn
const ROSTER = {
  reedbanks: { scavs: 9, flock: 2, crew: 2 },
  oldmill:   { scavs: 7, flock: 8, crew: 4 },
  depot:     { scavs: 6, flock: 6, crew: 10 },
};
function makeContract(f, mapId) {
  const others = FACTION_IDS.filter(x => x !== f); const target = others[Math.floor(hash2(Math.floor(Date.now() / 600000), f.length) * others.length)];
  const base = { reedbanks: 3, oldmill: 4, depot: 5 }[mapId]; return { faction: f, target, count: base, pay: base * 350 + 200, rep: 12 };
}

// ---------- hideout ----------
const HIDEOUT = {
  stash:      { name: 'Stash', icon: '▦', desc: 'Shelving for your loot. Bigger stash, more hoarding.', levels: [{ rows: 6 }, { rows: 10, cost: 1500, items: [['bolts', 4], ['tape', 2]] }, { rows: 16, cost: 4000, items: [['wires', 6], ['tape', 3], ['battery', 1]] }, { rows: 26, cost: 9000, items: [['battery', 2], ['gpu', 1]] }] },
  workbench:  { name: 'Workbench', icon: '🔧', desc: 'Craft ammo and gear from scrap. Level 2 repairs armor.', levels: [{}, { cost: 1200, items: [['bolts', 6], ['tape', 2]] }, { cost: 5000, items: [['battery', 1], ['wires', 8], ['lighter', 1]] }] },
  medstation: { name: 'Med Station', icon: '✚', desc: 'Turn scraps into meds. Level 2 makes field medkits.', levels: [{}, { cost: 1000, items: [['bandage', 3], ['canfood', 2]] }, { cost: 4500, items: [['medkit', 1], ['battery', 1]] }] },
};
function stashRows() { return HIDEOUT.stash.levels[G.save.hideout.stash].rows; }
const RECIPES = [
  { station: 'workbench', lvl: 1, in: [['bolts', 3], ['tape', 1]], out: ['ammo_9', 30] },
  { station: 'workbench', lvl: 1, in: [['bolts', 4], ['wires', 1]], out: ['ammo_12', 15] },
  { station: 'workbench', lvl: 2, in: [['bolts', 4], ['wires', 2]], out: ['ammo_556', 30] },
  { station: 'workbench', lvl: 2, in: [['wires', 3], ['battery', 1]], out: ['ammo_762', 20] },
  { station: 'workbench', lvl: 2, in: [['tape', 3], ['wires', 4], ['bolts', 6]], out: ['vest_light', 1] },
  { station: 'medstation', lvl: 1, in: [['tape', 1], ['canfood', 1]], out: ['bandage', 2] },
  { station: 'medstation', lvl: 1, in: [['bandage', 3], ['lighter', 1]], out: ['painkiller', 2] },
  { station: 'medstation', lvl: 2, in: [['bandage', 4], ['painkiller', 1], ['tape', 1]], out: ['medkit', 1] },
];
function stashCount(id) { return gridCount(G.save.stash, id); }
function stashTake(id, n) { const s = G.save.stash.items; let need = n; for (const it of s.slice()) { if (it.id !== id || need <= 0) continue; const take = Math.min(need, it.n || 1); need -= take; if (it.n) { it.n -= take; if (it.n <= 0) s.splice(s.indexOf(it), 1); } else s.splice(s.indexOf(it), 1); } return need <= 0; }
function canAfford(cost, items) { return G.save.money >= (cost || 0) && (items || []).every(([id, n]) => stashCount(id) >= n); }

// ---------- weather ----------
const WEATHER = {
  clear: { name: 'Clear', icon: '☾', view: 1.0, hear: 1.0, fog: 'rgba(4,6,14,0.93)', desc: 'Still night. You see far, and so do they.' },
  fog:   { name: 'Fog',   icon: '≋', view: 0.55, hear: 1.1, fog: 'rgba(70,80,90,0.94)', desc: 'Your flashlight dies in the mist. Sounds carry.' },
  rain:  { name: 'Rain',  icon: '☂', view: 0.85, hear: 0.6, fog: 'rgba(8,12,24,0.93)', rain: true, desc: 'Rain masks footsteps and gunfire. Good for sneaking. Bad for hearing.' },
  storm: { name: 'Storm', icon: '⚡', view: 0.7, hear: 0.5, fog: 'rgba(6,8,20,0.94)', rain: true, lightning: true, desc: 'Lightning lights up the whole marsh for a heartbeat. Everyone sees everyone.' },
};
function forecast(mapId) { // changes every 10 minutes of real time, per map
  const slot = Math.floor(Date.now() / 600000); const r = hash2(slot, mapId.length * 7 + 1);
  return r < 0.4 ? 'clear' : r < 0.6 ? 'fog' : r < 0.82 ? 'rain' : 'storm';
}

// ===== 01_inventory.js =====
// ---------- grid inventories (Tarkov-style) ----------
// A grid is { w, h, items: [item] } where each item carries x, y, rot (0|1).
const CELL = 44;
function itemSize(it) { const d = ITEMS[it.id]; return it.rot ? [d.h, d.w] : [d.w, d.h]; }
function gridMake(w, h, items) { return { w, h, items: items || [] }; }
function gridFits(g, it, x, y, rot, ignore) {
  const d = ITEMS[it.id]; const w = rot ? d.h : d.w, h = rot ? d.w : d.h;
  if (x < 0 || y < 0 || x + w > g.w || y + h > g.h) return false;
  for (const o of g.items) { if (o === ignore || o.uid === it.uid) continue; const [ow, oh] = itemSize(o); if (x < o.x + ow && x + w > o.x && y < o.y + oh && y + h > o.y) return false; }
  return true;
}
function gridFind(g, it) { // first fit, tries both rotations
  const d = ITEMS[it.id];
  for (let rot = 0; rot < (d.w === d.h ? 1 : 2); rot++) for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) if (gridFits(g, it, x, y, rot, it)) return { x, y, rot };
  return null;
}
function gridPlace(g, it, x, y, rot) { it.x = x; it.y = y; it.rot = rot || 0; if (!g.items.includes(it)) g.items.push(it); return it; }
function gridRemove(g, it) { const i = g.items.indexOf(it); if (i >= 0) g.items.splice(i, 1); }
// add with stacking; returns true if fully added
function gridAdd(g, it) {
  const d = ITEMS[it.id];
  if (d.stack) { for (const o of g.items) { if (o.id === it.id && o.n < d.stack) { const take = Math.min(d.stack - o.n, it.n); o.n += take; it.n -= take; if (it.n <= 0) return true; } } }
  const p = gridFind(g, it); if (!p) return false; gridPlace(g, it, p.x, p.y, p.rot); return true;
}
function gridCount(g, id) { return g.items.filter(i => i.id === id).reduce((a, i) => a + (i.n || 1), 0); }
function gridValue(g) { return g.items.reduce((a, i) => a + itemValue(i), 0); }
function gridFree(g) { let used = 0; for (const o of g.items) { const [w, h] = itemSize(o); used += w * h; } return g.w * g.h - used; }
function bagGrid(bag) { const d = ITEMS[bag.id]; if (!bag.items) bag.items = []; return { w: d.gw, h: d.gh, items: bag.items }; }
// take `n` of a stack out as a new item (for splitting / partial moves)
function splitStack(it, n) { const nu = { ...it, uid: Math.floor(Math.random() * 1e9), n }; it.n -= n; return nu; }

// ---------- DOM renderer + drag/drop ----------
const INV = {
  drag: null, grids: {}, slots: {}, onChange: null, menuEl: null,
  // html for a grid; key identifies it for drops
  grid(key, g, opts = {}) {
    this.grids[key] = { g, opts };
    const cells = `<div class="gcells" style="width:${g.w * CELL}px;height:${g.h * CELL}px"></div>`;
    const items = g.items.map(it => this.itemHtml(it, key)).join('');
    return `<div class="grid" data-grid="${key}" style="width:${g.w * CELL}px;height:${g.h * CELL}px">${cells}${items}</div>`;
  },
  itemHtml(it, key, extraStyle = '') {
    const d = ITEMS[it.id]; const [w, h] = itemSize(it);
    let badge = ''; if (it.n > 1) badge = it.n; else if (d.type === 'weapon') badge = `${it.ammo}/${d.mag}`; else if (d.type === 'armor') badge = Math.ceil(it.dur / d.dur * 100) + '%'; else if (d.type === 'key') badge = it.uses + '×'; else if (d.type === 'backpack' && it.items && it.items.length) badge = '●';
    const label = d.name.length > w * 7 ? d.name.split(' ')[0] : d.name;
    return `<div class="gitem t-${d.type}" data-uid="${it.uid}" data-grid="${key}" style="left:${it.x * CELL}px;top:${it.y * CELL}px;width:${w * CELL}px;height:${h * CELL}px;--c:${d.col};${extraStyle}" title="${esc(itemLabel(it))} · ${fmtMoney(itemValue(it))}"><span class="gl">${esc(label)}</span>${badge !== '' ? `<span class="gb">${badge}</span>` : ''}</div>`;
  },
  // equipment slot: accepts item types
  slot(key, it, label, accept, w = 4, h = 2) {
    this.slots[key] = { it, accept };
    const inner = it ? this.itemHtml({ ...it, x: 0, y: 0 }, 'slot:' + key, 'position:relative') : `<span class="sl">${label}</span>`;
    return `<div class="eslot ${it ? 'has' : ''}" data-slot="${key}" style="width:${w * CELL}px;height:${h * CELL}px">${inner}</div>`;
  },
  reset() { this.grids = {}; this.slots = {}; },
  // resolve item by uid from any registered grid or slot
  locate(uid) {
    for (const k in this.grids) { const it = this.grids[k].g.items.find(i => String(i.uid) === uid); if (it) return { kind: 'grid', key: k, g: this.grids[k].g, it }; }
    for (const k in this.slots) { const it = this.slots[k].it; if (it && String(it.uid) === uid) return { kind: 'slot', key: k, it }; }
    return null;
  },
  bind(root) {
    root.addEventListener('pointerdown', e => {
      const el = e.target.closest('.gitem'); if (!el) { this.closeMenu(); return; }
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      const src = this.locate(el.dataset.uid); if (!src) return; e.preventDefault(); this.closeMenu();
      const r = el.getBoundingClientRect();
      this.drag = { src, el, startX: e.clientX, startY: e.clientY, offX: e.clientX - r.left, offY: e.clientY - r.top, rot: src.it.rot || 0, moved: false, ghost: null, id: e.pointerId };
      try { el.setPointerCapture(e.pointerId); } catch (x) { }
    });
    root.addEventListener('pointermove', e => {
      const dg = this.drag; if (!dg) return;
      if (!dg.moved && Math.hypot(e.clientX - dg.startX, e.clientY - dg.startY) < 6) return;
      if (!dg.moved) { dg.moved = true; dg.ghost = dg.el.cloneNode(true); dg.ghost.classList.add('ghost'); dg.ghost.style.position = 'fixed'; dg.ghost.style.zIndex = 1000; dg.ghost.style.pointerEvents = 'none'; document.body.appendChild(dg.ghost); dg.el.style.opacity = 0.35; }
      this.applyRot(); dg.ghost.style.left = (e.clientX - dg.offX) + 'px'; dg.ghost.style.top = (e.clientY - dg.offY) + 'px';
      this.highlight(e.clientX - dg.offX + CELL / 2, e.clientY - dg.offY + CELL / 2);
    });
    const up = e => {
      const dg = this.drag; if (!dg) return; this.drag = null;
      if (dg.ghost) dg.ghost.remove(); dg.el.style.opacity = '';
      root.querySelectorAll('.gcell-hl').forEach(h => h.remove());
      if (!dg.moved) { this.openMenu(dg.src, e.clientX, e.clientY); return; }
      this.drop(dg, e.clientX - dg.offX + CELL / 2, e.clientY - dg.offY + CELL / 2);
    };
    root.addEventListener('pointerup', up); root.addEventListener('pointercancel', up);
    window.addEventListener('keydown', e => { if (this.drag && this.drag.moved && e.key.toLowerCase() === 'r') { this.drag.rot ^= 1; this.applyRot(); } });
  },
  applyRot() { const dg = this.drag; if (!dg || !dg.ghost) return; const d = ITEMS[dg.src.it.id]; const w = dg.rot ? d.h : d.w, h = dg.rot ? d.w : d.h; dg.ghost.style.width = w * CELL + 'px'; dg.ghost.style.height = h * CELL + 'px'; },
  rotateDrag() { if (this.drag && this.drag.moved) { this.drag.rot ^= 1; this.applyRot(); } },
  targetAt(px, py) {
    const els = document.elementsFromPoint(px, py);
    for (const el of els) { if (el.classList && el.classList.contains('grid')) { const r = el.getBoundingClientRect(); return { kind: 'grid', key: el.dataset.grid, x: Math.floor((px - r.left) / CELL), y: Math.floor((py - r.top) / CELL), el }; } if (el.classList && el.classList.contains('eslot')) return { kind: 'slot', key: el.dataset.slot, el }; }
    return null;
  },
  highlight(px, py) {
    const dg = this.drag; const t = this.targetAt(px, py); document.querySelectorAll('.gcell-hl').forEach(h => h.remove()); if (!t) return;
    const d = ITEMS[dg.src.it.id]; const w = dg.rot ? d.h : d.w, h = dg.rot ? d.w : d.h;
    const hl = document.createElement('div'); hl.className = 'gcell-hl';
    if (t.kind === 'grid') { const g = this.grids[t.key].g; const ok = gridFits(g, dg.src.it, t.x, t.y, dg.rot, dg.src.it); hl.style.cssText = `left:${t.x * CELL}px;top:${t.y * CELL}px;width:${w * CELL}px;height:${h * CELL}px;background:${ok ? 'rgba(80,255,120,0.35)' : 'rgba(255,80,80,0.35)'}`; t.el.appendChild(hl); }
    else { const s = this.slots[t.key]; const ok = s.accept.includes(d.type) && !s.it; hl.style.cssText = `inset:0;background:${ok ? 'rgba(80,255,120,0.35)' : 'rgba(255,80,80,0.35)'}`; t.el.appendChild(hl); }
  },
  drop(dg, px, py) {
    const t = this.targetAt(px, py); if (!t) return; const it = dg.src.it; const d = ITEMS[it.id];
    const take = () => { if (dg.src.kind === 'grid') gridRemove(dg.src.g, it); else this.slots[dg.src.key].it = null; };
    if (t.kind === 'grid') {
      const g = this.grids[t.key].g; const opts = this.grids[t.key].opts;
      if (opts.accept && !opts.accept.includes(d.type)) return;
      if (opts.only11 && (d.w > 1 || d.h > 1)) return;
      if (it.id && d.type === 'backpack' && opts.isBag) return; // no bags inside bags
      // stack merge onto same item?
      const under = g.items.find(o => o !== it && o.id === it.id && d.stack && o.n < d.stack && t.x >= o.x && t.x < o.x + itemSize(o)[0] && t.y >= o.y && t.y < o.y + itemSize(o)[1]);
      if (under) { const n = Math.min(d.stack - under.n, it.n); under.n += n; it.n -= n; if (it.n <= 0) take(); this.changed(dg.src.key, t.key); return; }
      if (!gridFits(g, it, t.x, t.y, dg.rot, it)) return;
      take(); gridPlace(g, it, t.x, t.y, dg.rot); this.changed(dg.src.key, t.key);
    } else {
      const s = this.slots[t.key]; if (!s.accept.includes(d.type)) return;
      if (s.it) { // swap: old slot item goes back to source grid if it fits
        if (dg.src.kind !== 'grid') return; const old = s.it; gridRemove(dg.src.g, it); const p = gridFind(dg.src.g, old); if (!p) { gridPlace(dg.src.g, it, it.x, it.y, it.rot); return; } gridPlace(dg.src.g, old, p.x, p.y, p.rot); s.it = it; this.changed(dg.src.key, t.key); return;
      }
      take(); s.it = it; this.changed(dg.src.key, t.key);
    }
  },
  changed(from, to) { if (this.onChange) this.onChange(from, to); },
  openMenu(src, x, y) { if (this.onMenu) this.onMenu(src, x, y); },
  closeMenu() { if (this.menuEl) { this.menuEl.remove(); this.menuEl = null; } },
  showMenu(x, y, actions) { // actions: [{label, fn}]
    this.closeMenu(); const m = document.createElement('div'); m.className = 'imenu'; m.style.left = Math.min(x, window.innerWidth - 170) + 'px'; m.style.top = Math.min(y, window.innerHeight - actions.length * 34 - 10) + 'px';
    m.innerHTML = actions.map((a, i) => `<button data-i="${i}">${a.label}</button>`).join('');
    m.addEventListener('pointerdown', e => e.stopPropagation()); m.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const a = actions[+b.dataset.i]; this.closeMenu(); a.fn(); });
    document.body.appendChild(m); this.menuEl = m;
  },
};

  const def = CONTAINER_DEF[type]; const out = [];

const QUEST_BY_ID = Object.fromEntries(QUESTS.map(q => [q.id, q]));

function questProgress(q) { const s = G.save; return s.quests.progress[q.id] || 0; }

    if (q.type === 'extract' && ((q.map && d.map !== q.map) || (q.timed && !d.timed))) continue;

}

}

  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.7; },
  // spatial helper: returns {gain, pan} for a world position relative to listener

  },
  step(x, y, loud) {

    this.noise(0.07, 'bandpass', 900 + Math.random() * 500, 1.5, (loud ? 0.22 : 0.12) * s.gain, s.pan, 0.002);
  },
  hit(x, y) { const s = this.spatial(x, y, 900); this.noise(0.06, 'bandpass', 2500, 2, 0.35 * s.gain, s.pan); this.tone(300, 0.08, 'triangle', 0.25 * s.gain, s.pan, 120); },
  whizz() { this.noise(0.12, 'bandpass', 3200 + Math.random() * 1500, 3, 0.35, Math.random() - 0.5, 0.002); },
  thunder() { this.noise(1.6, 'lowpass', 180, 0.7, 0.9, Math.random() - 0.5, 0.05); this.tone(45, 1.2, 'sine', 0.5, 0, 25); },
  hurt() { this.noise(0.15, 'lowpass', 600, 1, 0.6, 0); this.tone(180, 0.2, 'sawtooth', 0.25, 0, 60); },

  quack(x, y, pitch = 1) { const s = this.spatial(x, y, 700); if (s.gain < 0.02) return; this.tone(420 * pitch, 0.14, 'sawtooth', 0.14 * s.gain, s.pan, 220 * pitch); },

  tick() { this.tone(1200, 0.03, 'square', 0.05, 0); },

  death() { this.tone(200, 1.2, 'sawtooth', 0.4, 0, 30); this.noise(1.0, 'lowpass', 300, 1, 0.5, 0, 0.1); },

// ---------- world: map generation, collision, LOS, pathfinding ----------
const T = { GRASS: 0, WATER: 1, ROAD: 2, WALL: 3, FLOOR: 4, TREE: 5, MUD: 6, FENCE: 7, LOCKED: 8 };

  idx(x, y) { return y * this.w + x; }

  areaFree(x, y, w, h) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) { const t = this.get(i, j); if (t === T.WATER || t === T.WALL || t === T.FLOOR || t === T.ROAD) return false; } return true; }

    for (let j = by; j < by + bh; j++) for (let i = bx; i < bx + bw; i++) this.set(i, j, (i === bx || j === by || i === bx + bw - 1 || j === by + bh - 1) ? T.WALL : T.FLOOR);

      if (s === 2) this.set(bx, randi(by + 1, by + bh - 2), T.FLOOR); if (s === 3) this.set(bx + bw - 1, randi(by + 1, by + bh - 2), T.FLOOR);

  // --- A* on tile grid (8-neighbour, no corner cutting) ---
  astar(sx, sy, tx, ty, maxNodes = 2500) {

    }

  }
}

// ---------- entities ----------
const PLAYER_SPEED = 215, SPRINT_MULT = 1.5;

class Player {
  constructor(x, y, loadout) {
    this.x = x; this.y = y; this.r = 15; this.ang = 0; this.hp = 100; this.maxHp = 100; this.dead = false; this.faction = 'player';
    this.bleed = 0; this.stamina = 100; this.sprinting = false; this.moving = false; this.vx = 0; this.vy = 0;
    this.weapons = [loadout.w1 || null, loadout.w2 || null]; this.wi = this.weapons[0] ? 0 : (this.weapons[1] ? 1 : 0);
    this.armor = loadout.armor || null; this.bag = loadout.bag || null;
    this.pockets = gridMake(4, 1, (loadout.pockets && loadout.pockets.items) || []);
    this.fireT = 0; this.reloadT = 0; this.useT = 0; this.useItem = null; this.stepT = 0; this.hurtT = 0; this.kills = 0;
    this.searching = null; this.extracting = null; this.heartT = 0; this.light = true; this.magInfo = 'full'; this.checkT = 0;
  }
  get weapon() { return this.weapons[this.wi]; }
  get wdef() { return this.weapon ? ITEMS[this.weapon.id] : null; }
  grids() { const g = [this.pockets]; if (this.bag) g.push(bagGrid(this.bag)); return g; }
  allItems() { return this.grids().flatMap(g => g.items); }
  freeCells() { return this.grids().reduce((a, g) => a + gridFree(g), 0); }
  totalCells() { return this.grids().reduce((a, g) => a + g.w * g.h, 0); }
  speed() { let s = PLAYER_SPEED; if (this.armor) s *= 1 - ITEMS[this.armor.id].slow; if (this.sprinting && this.stamina > 0) s *= SPRINT_MULT; if (this.hp < 30) s *= 0.9; return s; }
  reserveAmmo(ammoId) { return this.grids().reduce((a, g) => a + gridCount(g, ammoId), 0); }
  addItem(it) { for (const g of this.grids()) if (gridAdd(g, it)) return true; return false; }
  removeItem(it) { for (const g of this.grids()) gridRemove(g, it); }
  hasKey(id) { return this.allItems().find(i => i.id === id); }
  update(dt, inp) {
    if (this.dead) return;
    const w = G.world;
    let mx = inp.mx, my = inp.my; const len = Math.hypot(mx, my); if (len > 1) { mx /= len; my /= len; }
    this.moving = len > 0.1;
    this.sprinting = inp.sprint && this.moving && this.stamina > 0 && !this.searching && !this.extracting;
    if (this.sprinting) this.stamina = Math.max(0, this.stamina - 28 * dt); else this.stamina = Math.min(100, this.stamina + (this.moving ? 12 : 22) * dt);
    const sp = this.speed() * (this.useItem ? 0.6 : 1);

    w.moveCircle(this, this.vx * dt, this.vy * dt);
    this.ang = inp.aim;
    if (this.moving) { this.stepT -= dt * (this.sprinting ? 1.6 : 1); if (this.stepT <= 0) { this.stepT = 0.36; SFX.step(undefined, undefined, this.sprinting); G.emitNoise(this.x, this.y, this.sprinting ? 300 : 120, 'step'); } }
    this.fireT -= dt;
    if (this.reloadT > 0) { this.reloadT -= dt; if (this.reloadT <= 0) this.finishReload(); }
    else if (inp.fire && this.weapon && !this.useItem && !this.searching && !this.extracting) {
      const wd = this.wdef;
      if (this.fireT <= 0 && (wd.auto || !inp.fireHeld)) {
        if (this.weapon.ammo > 0) this.shoot(); else if (!inp.fireHeld) { SFX.empty(); this.magInfo = 'empty'; this.reload(); }
      }
    }
    if (this.useItem) { this.useT -= dt; if (this.useT <= 0) this.finishUse(); }
    if (this.bleed > 0) { this.hp -= 1.6 * dt; this.hurtT = Math.max(this.hurtT, 0.05); if (this.hp <= 0) this.die('bleeding out'); }
    this.hurtT = Math.max(0, this.hurtT - dt); this.checkT = Math.max(0, this.checkT - dt);
    if (this.hp < 35) { this.heartT -= dt; if (this.heartT <= 0) { this.heartT = lerp(0.6, 1.1, this.hp / 35); SFX.heartbeat(); } }
    if (this.searching) { const c = this.searching.c; if (dist(this.x, this.y, c.x, c.y) > 70 || inp.fire) this.searching = null; else { this.searching.t += dt; if (Math.floor(this.searching.t * 6) !== Math.floor((this.searching.t - dt) * 6)) SFX.tick(); if (this.searching.t >= CONTAINER_DEF[c.type].time) { G.openContainer(c); this.searching = null; SFX.open(); questEvent('search', {}); } } }

    else { for (const e of w.extracts) if (G.extractOpen(e) && dist(this.x, this.y, e.x, e.y) < e.r) this.extracting = { e, t: 0 }; }
  }
  shoot() {
    const wd = this.wdef; this.weapon.ammo--; this.fireT = wd.rof; this.magInfo = null;
    const mx = this.x + Math.cos(this.ang) * 26, my = this.y + Math.sin(this.ang) * 26;
    for (let i = 0; i < wd.pellets; i++) { const a = this.ang + (rand() - 0.5) * 2 * wd.spread * Math.PI / 180 * (this.moving ? 1.4 : 1); G.bullets.push(new Bullet(mx, my, a, wd, this)); }
    G.flash(mx, my, 0.06); G.shake(wd.noise / 200); SFX.shot(this.weapon.id);

  }

  }
  finishReload() {
    const wd = this.wdef; if (!wd) return; let need = wd.mag - this.weapon.ammo;
    for (const g of this.grids()) for (const s of g.items.slice()) { if (s.id !== wd.ammo || need <= 0) continue; const take = Math.min(need, s.n); s.n -= take; need -= take; this.weapon.ammo += take; if (s.n <= 0) gridRemove(g, s); }

  }
  checkMag() { if (!this.weapon || this.reloadT > 0) return; this.checkT = 2.5; SFX.tick(); }
  switchWeapon(i) { if (i === undefined) i = 1 - this.wi; if (this.weapons[i]) { this.wi = i; this.reloadT = 0; this.fireT = 0.25; this.magInfo = null; this.checkT = 0; SFX.ui(); } }
  use(it) { const d = ITEMS[it.id]; if (d.type !== 'med' || this.useItem) return; this.useItem = it; this.useT = d.time; this.reloadT = 0; }
  finishUse() {
    const it = this.useItem, d = ITEMS[it.id]; this.useItem = null;
    if (!this.allItems().includes(it)) return;
    this.hp = Math.min(this.maxHp, this.hp + d.heal); if (d.stopBleed) this.bleed = 0;
    it.n = (it.n || 1) - 1; if (it.n <= 0) this.removeItem(it); SFX.chime(2); G.toast(d.name + ' used');
  }
  damage(dmg, from) {
    if (this.dead) return;
    if (this.armor && this.armor.dur > 0) { const ad = ITEMS[this.armor.id]; const absorbed = Math.min(dmg * ad.reduce, this.armor.dur); this.armor.dur -= absorbed * 0.8; dmg -= absorbed; if (this.armor.dur <= 0) G.toast('Armor destroyed!'); }
    this.hp -= dmg; this.hurtT = 0.35; SFX.hurt(); G.shake(6);
    if (chance(0.35)) this.bleed = 1;
    for (let i = 0; i < 6; i++) G.particles.push(new Particle(this.x, this.y, rand(TAU), rand(60, 160), 0.6, '#f8f0d0', 3));
    if (this.hp <= 0) this.die(from);
  }
  die(from) { if (this.dead) return; this.dead = true; this.hp = 0; SFX.death(); G.onPlayerDeath(from); }
}

const ENEMY_TYPES = {
  scav:  { name: 'Scav',    hp: 55,  speed: 150, col: '#8a8a7a', beak: '#d08030', weapons: [['pistol', 5], ['shotgun', 3], ['smg', 2]], accuracy: 11, reaction: 0.55, view: 440, armor: null,         burst: [2, 4], pause: [0.5, 1.2], xp: 30 },
  guard: { name: 'Guard',   hp: 95,  speed: 160, col: '#5a7a5a', beak: '#d08030', weapons: [['rifle', 4], ['smg', 2], ['shotgun', 1]], accuracy: 8, reaction: 0.4, view: 520, armor: 'vest_light', burst: [3, 6], pause: [0.4, 0.9], xp: 60 },
  crew:  { name: 'Crewman', hp: 75,  speed: 165, col: '#8a3a3a', beak: '#e0a040', weapons: [['smg', 4], ['rifle', 2], ['shotgun', 2]], accuracy: 9, reaction: 0.45, view: 480, armor: 'vest_light', burst: [3, 5], pause: [0.4, 1.0], xp: 50 },
  boss:  { name: 'The Drake', hp: 320, speed: 170, col: '#6a2a2a', beak: '#f0c040', weapons: [['dmr', 1], ['rifle', 2]], accuracy: 6, reaction: 0.3, view: 600, armor: 'vest_heavy', burst: [4, 7], pause: [0.3, 0.7], xp: 250, big: true },
};

class Enemy {
  constructor(x, y, type, home) {
    const d = ENEMY_TYPES[type]; this.type = type; this.d = d; this.faction = factionOf(type); this.x = x; this.y = y; this.r = d.big ? 19 : 15; this.ang = rand(TAU);
    this.hp = d.hp; this.maxHp = d.hp; this.dead = false; this.home = home; this.follow = false; this.betrayed = false;
    this.weaponId = weightedPick(d.weapons); this.ammo = ITEMS[this.weaponId].mag; this.reloadT = 0;
    this.armor = d.armor ? mk(d.armor) : null;
    this.state = 'patrol'; this.path = null; this.pathT = 0; this.waitT = rand(0.5, 3); this.target = null; this.tgtEnt = null; this.lastSeen = null; this.lostT = 0; this.scanT = rand(0.3);
    this.fireT = 0; this.burst = 0; this.react = 0; this.stepT = 0; this.alertT = 0; this.strafe = 0; this.strafeT = 0; this.hurtT = 0; this.vx = 0; this.vy = 0; this.quackT = rand(5, 20); this.lootC = null;
    this.loot = rollLoot(chance(0.4) ? 'crate' : 'locker'); if (type === 'boss') this.loot.push(mk('goldbar'), mk(pick(['gpu', 'ledger', 'drive']))); if ((type === 'guard' || type === 'crew') && chance(0.3)) this.loot.push(mk(pick(['watch', 'drive', 'wires'])));
    if (type === 'boss') this.loot.push(mk('key_depot')); else if (chance(0.06)) this.loot.push(mk(G.cfg.key));
  }
  hostileTo(e) { if (e === G.player) return G.ally !== this.faction || this.betrayed; return e.faction !== this.faction; }
  canSee(t) {
    const d = dist(this.x, this.y, t.x, t.y); let range = this.d.view * (t === G.player ? (t.light ? 1.25 : 0.65) * (t.sprinting ? 1.15 : 1) : 1) * G.weather.view;
    if (G.lightning > 0) range *= 2.5;
    if (d > range) return false;
    const a = Math.atan2(t.y - this.y, t.x - this.x); if (d > 70 && Math.abs(angleDiff(this.ang, a)) > 1.25) return false;
    return G.world.los(this.x, this.y, t.x, t.y);
  }
  scan() { // pick nearest visible hostile
    let best = null, bd = 1e9; const cands = [G.player, ...G.enemies];
    for (const c of cands) { if (c === this || c.dead || !this.hostileTo(c)) continue; const d = dist(this.x, this.y, c.x, c.y); if (d >= bd || d > 700) continue; if (this.canSee(c)) { best = c; bd = d; } }

    const mk2 = this.mask.getContext('2d'); const img = mk2.createImageData(w.w, w.h); const ex = G.explored; for (let i = 0; i < ex.length; i++) { img.data[i * 4 + 3] = ex[i] ? 255 : 0; } mk2.putImageData(img, 0, 0);
    m.globalCompositeOperation = 'destination-in'; m.imageSmoothingEnabled = false; m.drawImage(this.mask, 0, 0, this.mini.width, this.mini.height); m.globalCompositeOperation = 'source-over';
    return S;
  },
  drawMinimap(x, W, H, p, w, g) {
    this.miniT -= 1 / 60; if (this.miniT <= 0 || !this.mini) { this.miniT = 0.5; this.exploredMap(w); }
    const size = IS_TOUCH ? 110 : 150, S = 6, px = W - size - 14, py = IS_TOUCH ? 190 : 62; const view = 14; // tiles radius
    x.save(); x.fillStyle = '#000c'; x.fillRect(px - 3, py - 3, size + 6, size + 6); x.beginPath(); x.rect(px, py, size, size); x.clip();
    const sc = size / (view * 2 * S); x.translate(px + size / 2, py + size / 2); x.scale(sc, sc); x.translate(-p.x / TILE * S, -p.y / TILE * S);
    x.imageSmoothingEnabled = true; x.drawImage(this.mini, 0, 0);
    for (const m of g.objectiveMarkers()) { const mx = m.x / TILE * S, my = m.y / TILE * S; x.fillStyle = m.col; x.beginPath(); x.arc(mx, my, 7, 0, TAU); x.fill(); x.strokeStyle = '#000'; x.lineWidth = 2; x.stroke(); }
    x.translate(p.x / TILE * S, p.y / TILE * S); x.rotate(p.ang); x.fillStyle = '#f2d84a'; x.beginPath(); x.moveTo(10, 0); x.lineTo(-6, -6); x.lineTo(-6, 6); x.closePath(); x.fill();
    x.restore(); x.strokeStyle = '#fff6'; x.lineWidth = 1; x.strokeRect(px + 0.5, py + 0.5, size - 1, size - 1);
    x.fillStyle = '#9ab'; x.font = '10px sans-serif'; x.textAlign = 'right'; x.fillText(IS_TOUCH ? 'map' : '[M] map', px + size - 4, py + size + 12);
  },
  drawFullMap(x, W, H, p, w, g) {
    const S = this.exploredMap(w); const margin = 40; const sc = Math.min((W - margin * 2) / this.mini.width, (H - margin * 2) / this.mini.height);
    x.save(); x.fillStyle = 'rgba(5,8,12,0.92)'; x.fillRect(0, 0, W, H);
    const ox = (W - this.mini.width * sc) / 2, oy = (H - this.mini.height * sc) / 2; x.translate(ox, oy); x.scale(sc, sc);
    x.fillStyle = '#0d1510'; x.fillRect(0, 0, this.mini.width, this.mini.height); x.drawImage(this.mini, 0, 0);
    x.strokeStyle = '#fff3'; x.lineWidth = 1 / sc; x.strokeRect(0, 0, this.mini.width, this.mini.height);
    const F = 12 / sc; x.font = `bold ${F}px sans-serif`; x.textAlign = 'center';
    for (const m of g.objectiveMarkers()) { const mx = m.x / TILE * S, my = m.y / TILE * S; x.fillStyle = m.col; x.beginPath(); x.arc(mx, my, 6 / sc, 0, TAU); x.fill(); x.strokeStyle = '#000'; x.lineWidth = 2 / sc; x.stroke(); x.fillStyle = '#fff'; x.strokeStyle = '#000a'; x.lineWidth = 3 / sc; x.strokeText(m.label, mx, my - 10 / sc); x.fillText(m.label, mx, my - 10 / sc); }
    x.translate(p.x / TILE * S, p.y / TILE * S); x.rotate(p.ang); x.fillStyle = '#f2d84a'; x.strokeStyle = '#000'; x.lineWidth = 2 / sc; x.beginPath(); x.moveTo(12 / sc, 0); x.lineTo(-8 / sc, -8 / sc); x.lineTo(-8 / sc, 8 / sc); x.closePath(); x.fill(); x.stroke();
    x.restore();
    x.fillStyle = '#fff'; x.font = 'bold 16px sans-serif'; x.textAlign = 'center'; x.fillText(`${g.cfg.name} — ${fmtTime(g.timeLeft)} left`, W / 2, 26);
    x.font = '12px sans-serif'; x.fillStyle = '#9ab'; x.fillText(IS_TOUCH ? 'tap map button to close' : 'M or Esc to close · the raid keeps running', W / 2, H - 14);
  },
};

  onPlayerDeath(from) {
    if (this.state !== 'raid') return; const p = this.player; R.flashes = []; this.state = 'dying';
    const items = [...p.allItems(), ...p.weapons.filter(Boolean)]; if (p.armor) items.push(p.armor); if (p.bag) items.push(p.bag);
    const value = this.carriedValue(); const s = this.save; s.loadout = { w1: null, w2: null, armor: null, bag: null, pockets: gridMake(4, 1) }; s.stats.deaths++; s.stats.kills += p.kills;
    let charity = false; if (!s.stash.items.some(i => ITEMS[i.id].type === 'weapon') && s.money < buyPrice('pistol') + buyPrice('ammo_9')) { gridAdd(s.stash, mk('pistol')); gridAdd(s.stash, mk('ammo_9', 24)); gridAdd(s.stash, mk('bandage', 1)); charity = true; }
    this.persist(); SFX.stopAmbient();
    const kind = from === 'timeout' ? 'mia' : 'kia';
    setTimeout(() => { if (this.player !== p) return; this.state = 'result'; UI.results(kind, { msg: from === 'timeout' ? 'The raid timer ran out. Nobody came looking.' : `Killed by ${from}.`, items, kills: p.kills, xp: this.raidXp, time: this.time, value, charity }); }, kind === 'mia' ? 100 : 1600);
  },
  onKill(e) {
    const s = this.save; s.rep[e.faction] = clamp(s.rep[e.faction] - 8, -100, 100); for (const f of FACTION_IDS) if (f !== e.faction) s.rep[f] = clamp(s.rep[f] + 3, -100, 100);
    if (this.contract && e.faction === this.contract.target) { this.contract.kills++; if (this.contract.kills === this.contract.count) this.toast('Contract fulfilled — extract to get paid'); }
  },
  betray(e) { this.betrayed = true; this.save.rep[this.ally] = clamp(this.save.rep[this.ally] - 15, -100, 100); for (const o of this.enemies) if (o.faction === this.ally) { o.betrayed = true; o.follow = false; } this.toast(`${FACTIONS[this.ally].name} turn on you!`); if (this.contract) this.contract.count = 1e9; },
  // ----- helpers used by entities/render -----
  emitNoise(x, y, radius, src) { radius *= this.weather.hear; for (const e of this.enemies) if (e !== src) e.hear(x, y, radius, src); },
  flash(x, y, t) { R.flashes.push({ x, y, t }); },
  shake(a) { R.shake(a); },
  toast(msg) { this.toasts.unshift({ msg, t: 3.5 }); if (this.toasts.length > 4) this.toasts.pop(); },
  canPlayerSee(e) {
    const p = this.player; const d = dist(p.x, p.y, e.x, e.y);
    if (this.lightning > 0) return d < 1400 && this.world.los(p.x, p.y, e.x, e.y);
    const longR = this.VIEW_LONG * this.weather.view; if (d > longR) return false;
    if (d > this.VIEW_SHORT * 0.9) { if (!p.light) return false; const a = Math.atan2(e.y - p.y, e.x - p.x); if (Math.abs(angleDiff(p.ang, a)) > this.CONE_HALF + 0.06) return false; }
    return this.world.los(p.x, p.y, e.x, e.y);
  },
  nearestContainer() { const p = this.player; let best = null, bd = 64; for (const c of this.world.containers) { const d = dist(p.x, p.y, c.x, c.y); if (d < bd) { bd = d; best = c; } } return best; },
  nearestLocked() { const p = this.player, w = this.world; const tx = Math.floor(p.x / TILE), ty = Math.floor(p.y / TILE); let best = null, bd = 64; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { if (w.get(tx + dx, ty + dy) !== T.LOCKED) continue; const cx = (tx + dx) * TILE + TILE / 2, cy = (ty + dy) * TILE + TILE / 2; const d = dist(p.x, p.y, cx, cy); if (d < bd) { bd = d; best = { x: cx, y: cy, tx: tx + dx, ty: ty + dy }; } } return best; },
  openContainer(c, silent) {
    c.opened = true; if (!c.grid) { const d = CONTAINER_DEF[c.type]; c.grid = gridMake(d.gw, d.gh); const items = c.items || rollLoot(c.type); c.items = null; for (const it of items) gridAdd(c.grid, it); }
    if (!silent) UI.loot(c);
  },
  interact() {
    const p = this.player; if (p.dead) return; const c = this.nearestContainer();
    if (c) { if (c.opened) this.openContainer(c); else if (!p.searching) p.searching = { c, t: 0 }; return; }
    const ld = this.nearestLocked(); if (!ld) return; const key = p.hasKey(this.cfg.key);
    if (!key) { this.toast('Locked. Needs ' + ITEMS[this.cfg.key].name); SFX.empty(); return; }
    this.world.unlock(ld.tx, ld.ty); key.uses--; if (key.uses <= 0) { p.removeItem(key); this.toast(ITEMS[key.id].name + ' broke'); } R.prerenderMap(this.world); SFX.open(); this.toast('Unlocked'); this.emitNoise(p.x, p.y, 200, 'step');
  },
  objectiveMarkers() {
    const out = []; const w = this.world, ex = this.explored;
    const seen = (x, y) => ex[Math.floor(y / TILE) * w.w + Math.floor(x / TILE)];
    for (const e of w.extracts) out.push({ x: e.x, y: e.y, col: this.extractOpen(e) ? '#6f6' : '#f66', label: e.name + (this.extractOpen(e) ? '' : ' (closed)') });
    for (const r of w.lockedRooms) { if (w.get(r.door.x, r.door.y) === T.LOCKED && seen(r.door.x * TILE + 24, r.door.y * TILE + 24)) out.push({ x: r.door.x * TILE + 24, y: r.door.y * TILE + 24, col: '#f2d84a', label: 'Locked room' }); }
    for (const npc of Object.keys(NPCS)) {
      const q = activeQuestFor(npc); if (!q || questReady(q)) continue;
      if (q.type === 'kill' && q.who === 'boss') { const b = this.enemies.find(e => e.type === 'boss'); if (b && b.home) out.push({ x: (b.home.x + b.home.w / 2) * TILE, y: (b.home.y + b.home.h / 2) * TILE, col: '#f4a', label: "The Drake's warehouse" }); }
      if (q.type === 'bring') { const want = q.items.map(i => i[0]); for (const c of w.containers) { if (c.searched || !seen(c.x, c.y) || c.type === 'body') continue; const table = LOOT[c.type]; if (table && table.some(t => want.includes(t[0]))) out.push({ x: c.x, y: c.y, col: '#fd4', label: CONTAINER_DEF[c.type].name }); } }
    }
    return out;
  },
  // ----- input -----
  bindInput() {
    const I = this.input; const cv = R.cv;
    window.addEventListener('keydown', e => {
      if (e.repeat) return; const k = e.key.toLowerCase(); I.keys.add(k); if (['tab', ' '].includes(k)) e.preventDefault();
      if (this.state !== 'raid') return;
      if (k === 'escape') { if (UI.mapOpen) UI.mapOpen = false; else if (UI.lootOpen || UI.invOpen || UI.menu) UI.hide(); else if (UI.paused) UI.hide(); else UI.pause(); }
      if (UI.paused) return;
      if (k === 'tab' || k === 'i') { if (UI.invOpen) UI.hide(); else { UI.hide(); UI.inventory(); } }
      if (k === 'e') { if (UI.lootOpen) UI.hide(); else this.interact(); }
      if (k === 'f') { this.player.light = !this.player.light; SFX.tick(); }
      if (k === 'c') this.player.checkMag();
      if (k === 'q') this.player.switchWeapon(); if (k === '1') this.player.switchWeapon(0); if (k === '2') this.player.switchWeapon(1);
      if (k === 'r' && !INV.drag) this.player.reload();
      if (k === 'm') UI.toggleMap();
      if (k >= '3' && k <= '6') { const meds = this.player.allItems().filter(i => ITEMS[i.id].type === 'med'); const it = meds[+k - 3]; if (it) this.player.use(it); }
    });
    window.addEventListener('keyup', e => I.keys.delete(e.key.toLowerCase()));
    window.addEventListener('blur', () => I.keys.clear());
    window.addEventListener('mousemove', e => { I.mouse.x = e.clientX; I.mouse.y = e.clientY; });
    cv.addEventListener('mousedown', e => { SFX.init(); if (e.button === 0) I.mouse.down = true; if (e.button === 2) this.interact(); });
    window.addEventListener('mouseup', e => { if (e.button === 0) I.mouse.down = false; });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('wheel', e => { if (this.state === 'raid' && this.player) this.player.switchWeapon(); }, { passive: true });
    const T2 = UI.touch; const findTouch = id => (T2.move && T2.move.id === id) ? 'move' : (T2.aim && T2.aim.id === id) ? 'aim' : null;
    cv.addEventListener('touchstart', e => {
      SFX.init(); e.preventDefault(); if (this.state !== 'raid') return;
      for (const t of e.changedTouches) {
        const x = t.clientX, y = t.clientY; let hit = false;
        for (const b of UI.touchLayout(R.W, R.H)) { if (dist(x, y, b.x, b.y) < b.r + 8) { hit = true; this.touchButton(b.id); break; } }
        if (hit) continue;
        if (x < R.W / 2 && !T2.move) T2.move = { id: t.identifier, ox: x, oy: y, dx: 0, dy: 0 };
        else if (x >= R.W / 2 && !T2.aim) T2.aim = { id: t.identifier, ox: x, oy: y, dx: 0, dy: 0, mag: 0 };
      }
    }, { passive: false });
    cv.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) { const k = findTouch(t.identifier); if (!k) continue; const s = T2[k]; let dx = (t.clientX - s.ox) / 60, dy = (t.clientY - s.oy) / 60; const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; } s.dx = dx; s.dy = dy; s.mag = Math.min(1, m); if (m > 0.2) s.ang = Math.atan2(dy, dx); } }, { passive: false });
    const endT = e => { for (const t of e.changedTouches) { const k = findTouch(t.identifier); if (k) T2[k] = null; } };
    cv.addEventListener('touchend', endT); cv.addEventListener('touchcancel', endT);
  },
  touchButton(id) {
    const p = this.player; if (!p) return;
    if (id === 'reload') p.reload(); if (id === 'swap') p.switchWeapon(); if (id === 'inv') { if (UI.invOpen) UI.hide(); else { UI.hide(); UI.inventory(); } }
    if (id === 'sprint') this.input.sprintToggle = !this.input.sprintToggle; if (id === 'interact') this.interact(); if (id === 'pause') { if (UI.paused) UI.hide(); else UI.pause(); }
    if (id === 'light') { p.light = !p.light; SFX.tick(); } if (id === 'map') UI.toggleMap(); if (id === 'check') p.checkMag();
  },
  readInput() {
    const I = this.input, k = I.keys, p = this.player, T2 = UI.touch; const inp = { mx: 0, my: 0, aim: p.ang, fire: false, fireHeld: false, sprint: false };
    if (k.has('w') || k.has('arrowup')) inp.my -= 1; if (k.has('s') || k.has('arrowdown')) inp.my += 1; if (k.has('a') || k.has('arrowleft')) inp.mx -= 1; if (k.has('d') || k.has('arrowright')) inp.mx += 1;
    inp.sprint = k.has('shift');
    if (!IS_TOUCH) { const [wx, wy] = R.screenToWorld(I.mouse.x, I.mouse.y); inp.aim = Math.atan2(wy - p.y, wx - p.x); }
    if (I.mouse.down) { inp.fire = true; inp.fireHeld = I.mouse.wasDown; } I.mouse.wasDown = I.mouse.down;
    if (T2.move) { inp.mx = T2.move.dx; inp.my = T2.move.dy; }
    if (T2.aim) { if (T2.aim.ang !== undefined) inp.aim = T2.aim.ang; if (T2.aim.mag > 0.75) { inp.fire = true; inp.fireHeld = !!I.touchFiring; I.touchFiring = true; } else I.touchFiring = false; } else I.touchFiring = false;
    if (IS_TOUCH) inp.sprint = I.sprintToggle && (inp.mx || inp.my); if (IS_TOUCH && !(inp.mx || inp.my)) I.sprintToggle = false;
    if (UI.lootOpen || UI.invOpen) inp.fire = false;
    return inp;
  },
  // ----- loop -----
  loop(ts) {
    requestAnimationFrame(t => this.loop(t));
    let dt = Math.min(0.05, (ts - this.last) / 1000); this.last = ts;
    if (this.state === 'raid' || this.state === 'dying') { if (!UI.paused) this.update(dt); R.frame(dt); }
    else if (this.state === 'result' && this.world) R.frame(0.0001);
    else { const x = R.ctx; x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = '#14201a'; x.fillRect(0, 0, R.cv.width, R.cv.height); }
  },
  update(dt) {
    if (this.state !== 'raid' && this.state !== 'dying') return; const p = this.player, w = this.world; this.time += dt; this.timeLeft = this.cfg.time - this.time; this.frameN++;
    SFX.listener.x = p.x; SFX.listener.y = p.y;
    if (this.timeLeft <= 0 && !p.dead) { p.dead = true; this.onPlayerDeath('timeout'); return; }
    const inp = this.readInput(); if (!p.dead) p.update(dt, inp);
    for (const e of this.enemies) e.update(dt);
    for (const b of this.bullets) b.update(dt); this.bullets = this.bullets.filter(b => !b.dead);
    for (const pt of this.particles) pt.update(dt); this.particles = this.particles.filter(pt => pt.life > 0);
    for (const pg of this.pings) pg.t -= dt; this.pings = this.pings.filter(pg => pg.t > 0);
    for (const t of this.toasts) t.t -= dt; this.toasts = this.toasts.filter(t => t.t > 0);
    if (this.weather.lightning) { this.lightning = Math.max(0, this.lightning - dt); this.lightT -= dt; if (this.lightT <= 0) { this.lightT = rand(9, 24); this.lightning = 0.25; setTimeout(() => SFX.thunder(), 600 + Math.random() * 1500); } }
    for (const e of w.extracts) { if (!e._ann && this.time >= e.openAt && this.time < e.closeAt) { e._ann = true; if (this.time > 1) { this.toast(`${e.name} extract is OPEN`); SFX.chime(1); } } if (e._ann && !e._cl && this.time >= e.closeAt) { e._cl = true; this.toast(`${e.name} extract has CLOSED`); } }
    if (this.timeLeft < 60 && !this._warn) { this._warn = true; this.toast('ONE MINUTE LEFT'); }
  },
};
window.addEventListener('load', () => G.init());

</script>
