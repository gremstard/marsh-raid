<!DOCTYPE html>

<title>Marsh Raid</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .panel.inv, .panel.loot { max-width: 820px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: 3px; color: #f2d84a; text-shadow: 0 3px 0 #7a5a10; }
  h2 { margin: 0 0 10px; font-size: 18px; letter-spacing: 1px; color: #fff; display: flex; align-items: baseline; gap: 10px; }
  h2 small, h3 small { font-weight: normal; color: #9ab; font-size: 12px; }
  h3 { margin: 6px 0; font-size: 14px; color: #cde; display: flex; align-items: center; gap: 10px; }
  p { margin: 6px 0; line-height: 1.4; font-size: 14px; }
  .dim { color: #8a9a90; } .small { font-size: 12px; } .warn { color: #ffb347; font-weight: bold; }
  .money { color: #f2d84a; font-weight: bold; font-size: 18px; }
  .b { background: #3b5a44; color: #fff; border: 2px solid #142a1a; border-bottom-width: 4px; border-radius: 8px; padding: 6px 12px; font-weight: bold; font-size: 13px; cursor: pointer; margin: 2px; font-family: inherit; }
  .b:active { transform: translateY(2px); border-bottom-width: 2px; }
  .b.go { background: #d9a520; color: #2a1a00; border-color: #7a5a10; font-size: 16px; padding: 10px 20px; }
  .b.sell { background: #6a3a3a; border-color: #2a1414; }

  .b.icon { padding: 4px 8px; }
  .b.link { background: none; border: none; color: #8a9a90; text-decoration: underline; font-weight: normal; padding: 0; }

  .tabs { display: none; gap: 4px; }
  .tab { flex: 1; background: #22332a; color: #9ab; border: 2px solid #0d1410; border-radius: 8px; padding: 8px 4px; font-weight: bold; font-size: 12px; font-family: inherit; }
  .tab.on { background: #3b5a44; color: #fff; }
  .cols { display: flex; gap: 12px; flex: 1; min-height: 0; }
  .cols section { flex: 1; background: #1f2a24; border: 3px solid #0d1410; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .list { overflow: auto; flex: 1; min-height: 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-bottom: 1px solid #0d141066; font-size: 13px; }
  .row:hover { background: #ffffff08; }
  .row .nm { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .row .nm small { color: #8a9a90; width: 100%; font-size: 11px; }
  .row .vl { color: #f2d84a; white-space: nowrap; font-size: 12px; }
  .row .acts { white-space: nowrap; }
  .row.lock { opacity: 0.5; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 2px solid #0008; flex: none; }
  .slot { background: #16201a; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .slot b { color: #9ab; width: 84px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  .slot span { flex: 1; display: flex; align-items: center; gap: 8px; }
  .slot.act { outline: 2px solid #f2d84a; }
  .maps { display: flex; flex-direction: column; gap: 8px; overflow: auto; }
  .map { background: #16201a; border-left: 6px solid; border-radius: 8px; padding: 10px 12px; }
  .map b { font-size: 16px; } .map small { color: #9ab; margin-left: 8px; } .map p { font-size: 12px; margin: 4px 0; }
  .npc { background: #16201a; border-left: 6px solid; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .npc .nh { display: flex; align-items: center; gap: 8px; } .npc .nh small { color: #9ab; } .npc .qt { color: #f2d84a; display: block; margin-top: 6px; }
  .two { display: flex; gap: 14px; } .two > div { flex: 1; min-width: 0; display: flex; flex-direction: column; max-height: 60vh; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0; font-size: 13px; color: #9ab; } .stats b { color: #fff; font-size: 16px; margin-left: 4px; }

  @media (max-width: 1000px) {

    .hub { padding: 8px; } h1 { font-size: 20px; } .hub .meta { font-size: 12px; gap: 10px; }
    .two { flex-direction: column; } .two > div { max-height: 34vh; }

<script>
// ===== 00_util.js =====
'use strict';
// ---------- utilities ----------
const TILE = 48;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const angleDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let rng = Math.random;
const rand = (a = 1, b) => (b === undefined ? rng() * a : a + rng() * (b - a));
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];
const chance = p => rng() < p;
function weightedPick(table) { let tot = 0; for (const e of table) tot += e[1]; let r = rng() * tot; for (const e of table) { r -= e[1]; if (r <= 0) return e[0]; } return table[table.length - 1][0]; }
function fmtTime(s) { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function fmtMoney(n) { return '₵' + Math.round(n).toLocaleString('en-US'); }
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ===== 01_items.js =====
// ---------- item & weapon definitions ----------
// value = sell price at the trader; buy price = value * TRADER_MARKUP
const TRADER_MARKUP = 1.7;
const ITEMS = {
  // weapons
  pistol:  { name: 'P9 Pistol',    type: 'weapon', ammo: 'ammo_9',   dmg: 18, mag: 12, rof: 0.20, spread: 4,  speed: 980,  range: 520, reload: 1.2, auto: false, noise: 420, pellets: 1, value: 260,  col: '#9aa3ad', desc: 'Reliable sidearm. Quiet-ish.' },
  smg:     { name: 'Reed SMG',     type: 'weapon', ammo: 'ammo_9',   dmg: 14, mag: 30, rof: 0.085, spread: 7, speed: 980,  range: 480, reload: 1.8, auto: true,  noise: 480, pellets: 1, value: 800,  col: '#6f7c8a', desc: 'Sprays 9mm. Great up close.' },
  shotgun: { name: 'Marsh 12',     type: 'weapon', ammo: 'ammo_12',  dmg: 9,  mag: 6,  rof: 0.85, spread: 11, speed: 900,  range: 330, reload: 2.4, auto: false, noise: 700, pellets: 7, value: 700,  col: '#8a6a4a', desc: 'Seven pellets of bad news.' },
  rifle:   { name: 'AK-Duck',      type: 'weapon', ammo: 'ammo_556', dmg: 27, mag: 30, rof: 0.11, spread: 3.5, speed: 1200, range: 700, reload: 2.2, auto: true,  noise: 620, pellets: 1, value: 1600, col: '#5c4a3a', desc: 'Full auto. Loud.' },
  dmr:     { name: 'Heron DMR',    type: 'weapon', ammo: 'ammo_762', dmg: 58, mag: 10, rof: 0.55, spread: 1.2, speed: 1500, range: 1000, reload: 2.6, auto: false, noise: 820, pellets: 1, value: 2300, col: '#3f4a3a', desc: 'One shot, one duck. Very loud.' },
  // ammo
  ammo_9:   { name: '9mm Rounds',   type: 'ammo', stack: 60, value: 1.2, col: '#d9b84a' },
  ammo_12:  { name: '12g Shells',   type: 'ammo', stack: 30, value: 3.0, col: '#c8503a' },
  ammo_556: { name: '5.56 Rounds',  type: 'ammo', stack: 60, value: 2.2, col: '#c9c05a' },
  ammo_762: { name: '7.62 Rounds',  type: 'ammo', stack: 40, value: 4.0, col: '#b48a3a' },
  // meds
  bandage:    { name: 'Bandage',    type: 'med', heal: 15, time: 1.5, stopBleed: true,  stack: 5, value: 45,  col: '#f0e6d8', desc: 'Stops bleeding. +15 HP.' },
  medkit:     { name: 'Field Medkit', type: 'med', heal: 65, time: 3.0, stopBleed: true, stack: 1, value: 220, col: '#e8e8e8', desc: 'Stops bleeding. +65 HP.' },
  painkiller: { name: 'Painkillers', type: 'med', heal: 30, time: 1.0, stopBleed: false, stack: 3, value: 90, col: '#f0a040', desc: 'Quick +30 HP. Does not stop bleeding.' },
  // armor
  vest_light: { name: 'Light Vest',  type: 'armor', dur: 40, reduce: 0.35, slow: 0.0,  value: 420,  col: '#5a7a5a', desc: 'Absorbs 35% of damage until worn out.' },
  vest_heavy: { name: 'Heavy Plate', type: 'armor', dur: 80, reduce: 0.55, slow: 0.10, value: 1100, col: '#3a4a5a', desc: 'Absorbs 55%. 10% slower.' },
  // backpacks
  bag_small: { name: 'Scout Pack', type: 'backpack', slots: 6,  value: 300, col: '#7a6a4a', desc: '+6 slots.' },
  bag_big:   { name: 'Raider Pack', type: 'backpack', slots: 12, value: 850, col: '#4a5a3a', desc: '+12 slots.' },
  // valuables & junk
  watch:    { name: 'Gold Watch',   type: 'loot', value: 650,  col: '#e8c04a' },
  ring:     { name: 'Signet Ring',  type: 'loot', value: 900,  col: '#f0d060' },
  gpu:      { name: 'Graphics Card', type: 'loot', value: 2400, col: '#4a9a6a' },
  drive:    { name: 'Flash Drive',  type: 'loot', value: 1500, col: '#4a6ae0' },
  goldbar:  { name: 'Gold Bar',     type: 'loot', value: 4200, col: '#ffcc33' },
  ledger:   { name: 'Smuggler Ledger', type: 'loot', value: 3000, col: '#8a4a3a' },
  canfood:  { name: 'Canned Beans', type: 'loot', value: 55,   col: '#7a9a5a', stack: 4 },
  wires:    { name: 'Copper Wire',  type: 'loot', value: 110,  col: '#c8783a', stack: 4 },
  bolts:    { name: 'Bolts',        type: 'loot', value: 70,   col: '#8a8a8a', stack: 6 },
  battery:  { name: 'Car Battery',  type: 'loot', value: 260,  col: '#2a2a2a' },
  lighter:  { name: 'Zippo',        type: 'loot', value: 95,   col: '#c0c0c0' },
  tape:     { name: 'Duct Tape',    type: 'loot', value: 60,   col: '#6a6a7a', stack: 3 },
  bread:    { name: 'Stale Bread',  type: 'loot', value: 20,   col: '#c8a060', stack: 3 },
};
for (const k in ITEMS) ITEMS[k].id = k;
const WEAPON_IDS = ['pistol', 'smg', 'shotgun', 'rifle', 'dmr'];
function itemDef(it) { return ITEMS[it.id]; }
function mk(id, n) { const d = ITEMS[id]; const it = { id, uid: Math.floor(Math.random() * 1e9) }; if (d.type === 'weapon') it.ammo = d.mag; else if (d.type === 'armor') it.dur = d.dur; else if (d.stack) it.n = n || 1; return it; }
function itemLabel(it) { const d = ITEMS[it.id]; let s = d.name; if (it.n > 1) s += ' ×' + it.n; if (d.type === 'weapon') s += ` [${it.ammo}/${d.mag}]`; if (d.type === 'armor') s += ` (${Math.ceil(it.dur)}/${d.dur})`; return s; }
function itemValue(it) { const d = ITEMS[it.id]; let v = d.value * (it.n || 1); if (d.type === 'armor') v *= 0.3 + 0.7 * (it.dur / d.dur); return Math.round(v); }
function buyPrice(id) { const d = ITEMS[id]; return Math.round(d.value * TRADER_MARKUP * (d.type === 'ammo' ? d.stack : 1)); }

// Trader stock: [id, count for stackables]
const TRADER_STOCK = ['pistol', 'smg', 'shotgun', 'rifle', 'dmr', 'ammo_9', 'ammo_12', 'ammo_556', 'ammo_762', 'bandage', 'medkit', 'painkiller', 'vest_light', 'vest_heavy', 'bag_small', 'bag_big'];
const TRADER_REQ = { rifle: 4, dmr: 7, vest_heavy: 5, bag_big: 3, smg: 2, medkit: 2 };
function traderUnlocked(id, level) { return (TRADER_REQ[id] || 0) <= level || (G.save && G.save.unlocks.includes(id)); }

// Loot tables: [id, weight]
const LOOT = {
  crate:   [['canfood', 8], ['bolts', 8], ['wires', 5], ['tape', 6], ['bread', 6], ['bandage', 5], ['ammo_9', 6], ['ammo_12', 3], ['ammo_556', 2], ['lighter', 3], ['painkiller', 2], ['watch', 1]],
  locker:  [['bandage', 5], ['ammo_9', 5], ['ammo_556', 3], ['ammo_762', 2], ['pistol', 3], ['vest_light', 2], ['tape', 3], ['lighter', 3], ['watch', 2], ['canfood', 3], ['bag_small', 1]],
  medbox:  [['bandage', 8], ['painkiller', 5], ['medkit', 3]],
  weaponbox: [['pistol', 5], ['shotgun', 4], ['smg', 3], ['rifle', 2], ['dmr', 1], ['ammo_9', 5], ['ammo_12', 4], ['ammo_556', 4], ['ammo_762', 2], ['vest_light', 2], ['vest_heavy', 1]],
  safe:    [['watch', 5], ['ring', 5], ['drive', 4], ['gpu', 2], ['goldbar', 1], ['ledger', 1]],
  scrap:   [['bolts', 6], ['wires', 6], ['battery', 3], ['tape', 4], ['lighter', 2], ['gpu', 1]],
};
const CONTAINER_DEF = {
  crate:     { name: 'Supply Crate', time: 1.4, rolls: [1, 3], w: 36, h: 30, col: '#8a6a3a' },
  locker:    { name: 'Locker',       time: 1.8, rolls: [1, 3], w: 26, h: 40, col: '#5a6a7a' },
  medbox:    { name: 'Med Box',      time: 1.2, rolls: [1, 2], w: 30, h: 24, col: '#e8e8e8' },
  weaponbox: { name: 'Weapon Case',  time: 2.4, rolls: [1, 2], w: 44, h: 24, col: '#2a3a2a' },
  safe:      { name: 'Safe',         time: 3.5, rolls: [1, 2], w: 32, h: 32, col: '#3a3a44' },
  scrap:     { name: 'Scrap Pile',   time: 1.2, rolls: [1, 2], w: 40, h: 34, col: '#6a6a5a' },
  body:      { name: 'Body',         time: 1.0, rolls: [0, 0], w: 40, h: 40, col: '#777' },
};
function rollLoot(type) {
  const def = CONTAINER_DEF[type]; const out = [];
  const n = randi(def.rolls[0], def.rolls[1]);
  for (let i = 0; i < n; i++) {
    const id = weightedPick(LOOT[type]); const d = ITEMS[id];
    let cnt = 1; if (d.type === 'ammo') cnt = randi(Math.floor(d.stack * 0.25), Math.floor(d.stack * 0.7)); else if (d.stack) cnt = randi(1, Math.min(d.stack, 3));
    const existing = out.find(o => o.id === id && d.stack); if (existing) existing.n = Math.min(d.stack, existing.n + cnt); else out.push(mk(id, cnt));
  }
  return out;
}

// ---------- maps ----------
const MAPS = {
  reedbanks: { name: 'Reedbanks', sub: 'Marshland · Easy', w: 46, h: 46, time: 10 * 60, buildings: 7, scavs: 9, guards: 0, boss: 0, trees: 0.07, water: 0.5, lootMul: 1.0, desc: 'Flat wetlands with scattered sheds. Scavs patrol in small groups.', color: '#4a7a3a' },
  oldmill:   { name: 'Old Mill',  sub: 'Village · Medium', w: 56, h: 56, time: 12 * 60, buildings: 12, scavs: 14, guards: 4, boss: 0, trees: 0.05, water: 0.35, lootMul: 1.3, desc: 'A ruined village around a mill. Armed guards hold the center.', color: '#7a6a3a' },
  depot:     { name: 'The Depot', sub: 'Industrial · Hard', w: 64, h: 64, time: 15 * 60, buildings: 16, scavs: 18, guards: 7, boss: 1, trees: 0.03, water: 0.25, lootMul: 1.7, desc: 'Warehouses full of loot. The Drake and his crew run the place.', color: '#5a4a5a' },
};

// ===== 01_quests.js =====
// ---------- hideout NPCs & quest chains ----------
// Each NPC has an ordered chain. The first unfinished quest is always the active one.
// type: kill | search | extract | bring | loot | closecall | earn
const NPCS = {
  mallard: { name: 'Old Mallard', role: 'Trader', col: '#d9a520', greet: 'Everything has a price, kid. Even you.' },
  teal:    { name: 'Doc Teal',    role: 'Medic',  col: '#e8e8e8', greet: 'Bring me supplies and I will keep you breathing.' },
  gander:  { name: 'Gus Gander',  role: 'Gunsmith', col: '#6f7c8a', greet: 'Guns do not kill scavs. Ducks with guns do.' },
  hermit:  { name: 'The Hermit',  role: 'Guide', col: '#5a7a5a', greet: 'The marsh remembers every footstep.' },
};
const QUESTS = [
  // --- Old Mallard: loot & economy ---
  { id: 'm1', npc: 'mallard', title: 'First Pickings', desc: 'Search 5 containers in any raid.', type: 'search', count: 5, reward: { money: 300, xp: 80, items: [['bandage', 2]] } },
  { id: 'm2', npc: 'mallard', title: 'Scrap Run', desc: 'Bring me 3 Copper Wire and 3 Bolts.', type: 'bring', items: [['wires', 3], ['bolts', 3]], reward: { money: 600, xp: 150, items: [['bag_small', 1]] } },
  { id: 'm3', npc: 'mallard', title: 'Big Haul', desc: 'Extract from a raid carrying loot worth at least ₵2,500.', type: 'loot', count: 2500, reward: { money: 900, xp: 250, unlock: 'bag_big' } },
  { id: 'm4', npc: 'mallard', title: 'Shiny Things', desc: 'Bring me a Gold Watch and a Signet Ring.', type: 'bring', items: [['watch', 1], ['ring', 1]], reward: { money: 2500, xp: 400, items: [['vest_light', 1]] } },
  { id: 'm5', npc: 'mallard', title: 'The Ledger', desc: 'The Drake keeps a smuggler ledger at the Depot. Bring it to me.', type: 'bring', items: [['ledger', 1]], reward: { money: 8000, xp: 1200, items: [['goldbar', 1]] } },
  // --- Doc Teal: meds & survival ---
  { id: 't1', npc: 'teal', title: 'Supply Line', desc: 'Bring me 3 Bandages.', type: 'bring', items: [['bandage', 3]], reward: { money: 250, xp: 80, items: [['medkit', 1]], unlock: 'medkit' } },
  { id: 't2', npc: 'teal', title: 'Close Call', desc: 'Extract from a raid with less than 30 HP.', type: 'closecall', count: 1, reward: { money: 500, xp: 200, items: [['painkiller', 3]] } },
  { id: 't3', npc: 'teal', title: 'Field Research', desc: 'Bring me 2 Field Medkits and 2 Painkillers.', type: 'bring', items: [['medkit', 2], ['painkiller', 2]], reward: { money: 1200, xp: 300, items: [['vest_heavy', 1]], unlock: 'vest_heavy' } },
  { id: 't4', npc: 'teal', title: 'Iron Lungs', desc: 'Extract 5 times in total.', type: 'extract', count: 5, reward: { money: 2000, xp: 500, items: [['medkit', 3]] } },
  // --- Gus Gander: combat ---
  { id: 'g1', npc: 'gander', title: 'Pest Control', desc: 'Kill 5 scavs.', type: 'kill', who: 'scav', count: 5, reward: { money: 400, xp: 120, items: [['ammo_9', 60]], unlock: 'smg' } },
  { id: 'g2', npc: 'gander', title: 'Shotgun Wedding', desc: 'Kill 8 enemies with the Marsh 12 shotgun.', type: 'kill', weapon: 'shotgun', count: 8, reward: { money: 800, xp: 250, items: [['ammo_12', 30]] } },
  { id: 'g3', npc: 'gander', title: 'Guard Duty', desc: 'Kill 6 Guards at Old Mill or the Depot.', type: 'kill', who: 'guard', count: 6, reward: { money: 1500, xp: 400, items: [['rifle', 1], ['ammo_556', 60]], unlock: 'rifle' } },
  { id: 'g4', npc: 'gander', title: 'Long Shot', desc: 'Kill 10 enemies with the Heron DMR.', type: 'kill', weapon: 'dmr', count: 10, reward: { money: 3000, xp: 700, unlock: 'dmr' } },
  { id: 'g5', npc: 'gander', title: 'Duck Hunt', desc: 'Kill The Drake at the Depot.', type: 'kill', who: 'boss', count: 1, reward: { money: 6000, xp: 1500, items: [['dmr', 1], ['ammo_762', 40]] } },

const QUEST_BY_ID = Object.fromEntries(QUESTS.map(q => [q.id, q]));

  // spatial helper: returns {gain, pan} for a world position relative to listener

      }
    }
    return null;
  }
}

// ---------- entities ----------
const PLAYER_SPEED = 215, SPRINT_MULT = 1.5;

class Player {
  constructor(x, y, loadout) {
    this.x = x; this.y = y; this.r = 15; this.ang = 0; this.hp = 100; this.maxHp = 100; this.dead = false;
    this.bleed = 0; this.stamina = 100; this.sprinting = false; this.moving = false; this.vx = 0; this.vy = 0;
    this.weapons = [loadout.w1 || null, loadout.w2 || null]; this.wi = this.weapons[0] ? 0 : (this.weapons[1] ? 1 : 0);
    this.armor = loadout.armor || null; this.bag = loadout.bag || null;
    this.inv = loadout.carry.map(i => ({ ...i }));
    this.fireT = 0; this.reloadT = 0; this.useT = 0; this.useItem = null; this.stepT = 0; this.hurtT = 0; this.noiseT = 0; this.kills = 0; this.lootValue = 0;
    this.searching = null; // {container, t}
    this.extracting = null; // {extract, t}
    this.heartT = 0; this.light = true; this.magInfo = 'full'; this.checkT = 0;
  }
  get capacity() { return 4 + (this.bag ? ITEMS[this.bag.id].slots : 0); }
  get weapon() { return this.weapons[this.wi]; }
  get wdef() { return this.weapon ? ITEMS[this.weapon.id] : null; }
  speed() { let s = PLAYER_SPEED; if (this.armor) s *= 1 - ITEMS[this.armor.id].slow; if (this.sprinting && this.stamina > 0) s *= SPRINT_MULT; if (this.hp < 30) s *= 0.9; return s; }
  reserveAmmo(ammoId) { return this.inv.filter(i => i.id === ammoId).reduce((a, i) => a + i.n, 0); }
  addItem(it) { // returns false if no room
    const d = ITEMS[it.id];
    if (d.stack) { for (const s of this.inv) { if (s.id === it.id && s.n < d.stack) { const take = Math.min(d.stack - s.n, it.n); s.n += take; it.n -= take; if (it.n <= 0) return true; } } }
    if (this.inv.length >= this.capacity) return false;
    this.inv.push(it); return true;
  }
  removeItem(it) { const i = this.inv.indexOf(it); if (i >= 0) this.inv.splice(i, 1); }
  update(dt, inp) {
    if (this.dead) return;
    const w = G.world;
    // movement
    let mx = inp.mx, my = inp.my; const len = Math.hypot(mx, my); if (len > 1) { mx /= len; my /= len; }
    this.moving = len > 0.1;
    this.sprinting = inp.sprint && this.moving && this.stamina > 0 && !this.searching && !this.extracting;
    if (this.sprinting) this.stamina = Math.max(0, this.stamina - 28 * dt); else this.stamina = Math.min(100, this.stamina + (this.moving ? 12 : 22) * dt);
    const sp = this.speed() * (this.useItem ? 0.6 : 1);
    this.vx = mx * sp; this.vy = my * sp;
    w.moveCircle(this, this.vx * dt, this.vy * dt);
    this.ang = inp.aim;
    // footsteps / noise
    if (this.moving) { this.stepT -= dt * (this.sprinting ? 1.6 : 1); if (this.stepT <= 0) { this.stepT = 0.36; SFX.step(undefined, undefined, this.sprinting); G.emitNoise(this.x, this.y, this.sprinting ? 300 : 120, 'step'); } }

    if (this.reloadT > 0) { this.reloadT -= dt; if (this.reloadT <= 0) this.finishReload(); }
    else if (inp.fire && this.weapon && !this.useItem && !this.searching && !this.extracting) {
      const wd = this.wdef;

    }
    if (inp.reload) this.reload();

    if (this.useItem) { this.useT -= dt; if (this.useT <= 0) this.finishUse(); }
    // bleeding
    if (this.bleed > 0) { this.hp -= 1.6 * dt; this.hurtT = Math.max(this.hurtT, 0.05); if (this.hp <= 0) this.die('bled out'); }

    else { for (const e of w.extracts) if (G.extractOpen(e) && dist(this.x, this.y, e.x, e.y) < e.r) { this.extracting = { e, t: 0 }; } }
  }
  shoot() {
    const wd = this.wdef; this.weapon.ammo--; this.fireT = wd.rof; this.magInfo = null;

    for (let i = 0; i < wd.pellets; i++) { const a = this.ang + (rand() - 0.5) * 2 * wd.spread * Math.PI / 180 * (this.moving ? 1.4 : 1); G.bullets.push(new Bullet(mx, my, a, wd, this)); }

  switchWeapon(i) { if (i === undefined) i = 1 - this.wi; if (this.weapons[i]) { this.wi = i; this.reloadT = 0; this.fireT = 0.25; this.magInfo = null; this.checkT = 0; SFX.ui(); } }
  use(it) { const d = ITEMS[it.id]; if (d.type !== 'med' || this.useItem) return; this.useItem = it; this.useT = d.time; this.reloadT = 0; }
  finishUse() {
    const it = this.useItem, d = ITEMS[it.id]; this.useItem = null;
    if (!this.inv.includes(it)) return;

    if (this.dead) return;

    this.hp -= dmg; this.hurtT = 0.35; SFX.hurt(); G.shake(6);
    if (chance(0.35)) this.bleed = 1;
    for (let i = 0; i < 6; i++) G.particles.push(new Particle(this.x, this.y, rand(TAU), rand(60, 160), 0.6, '#f8f0d0', 3));
    if (this.hp <= 0) this.die(from);
  }
  die(from) { if (this.dead) return; this.dead = true; this.hp = 0; SFX.death(); G.onPlayerDeath(from); }
}

const ENEMY_TYPES = {
  scav:  { name: 'Scav',  hp: 55,  speed: 150, col: '#8a8a7a', beak: '#d08030', weapons: [['pistol', 5], ['shotgun', 3], ['smg', 2]], accuracy: 11, reaction: 0.55, view: 440, armor: null,         burst: [2, 4], pause: [0.5, 1.2], xp: 30 },
  guard: { name: 'Guard', hp: 95,  speed: 160, col: '#5a7a5a', beak: '#d08030', weapons: [['rifle', 4], ['smg', 2], ['shotgun', 1]], accuracy: 8, reaction: 0.4, view: 520, armor: 'vest_light', burst: [3, 6], pause: [0.4, 0.9], xp: 60 },
  boss:  { name: 'The Drake', hp: 320, speed: 170, col: '#6a2a2a', beak: '#f0c040', weapons: [['dmr', 1], ['rifle', 2]], accuracy: 6, reaction: 0.3, view: 600, armor: 'vest_heavy', burst: [4, 7], pause: [0.3, 0.7], xp: 250, big: true },

class Enemy {
  constructor(x, y, type, home) {
    const d = ENEMY_TYPES[type]; this.type = type; this.d = d; this.x = x; this.y = y; this.r = d.big ? 19 : 15; this.ang = rand(TAU);
    this.hp = d.hp; this.maxHp = d.hp; this.dead = false; this.home = home;
    this.weaponId = weightedPick(d.weapons); this.ammo = ITEMS[this.weaponId].mag; this.reloadT = 0;
    this.armor = d.armor ? mk(d.armor) : null;
    this.state = 'patrol'; this.path = null; this.pathT = 0; this.waitT = rand(0.5, 3); this.target = null; this.lastSeen = null; this.lostT = 0;

// ===== 07_main.js =====
// ---------- game core: state, input, loop, persistence ----------
const SAVE_KEY = 'marshraid_save_v1';
const G = {
  VIEW_SHORT: 3.2 * TILE, VIEW_LONG: 14 * TILE, CONE_HALF: 0.62,
  state: 'hub', save: null, world: null, player: null, enemies: [], bullets: [], particles: [], pings: [], toasts: [], time: 0, timeLeft: 0, cfg: null, ui: UI,
  input: { keys: new Set(), mouse: { x: 0, y: 0, down: false, wasDown: false }, sprintToggle: false, edge: {} },
  init() {
    R.init(); UI.init(); this.load(); this.bindInput(); UI.hub();
    this.last = performance.now(); requestAnimationFrame(ts => this.loop(ts));
  },
  // ----- persistence -----
  newSave() {
    this.save = { money: 900, stash: [mk('ammo_9', 36), mk('bandage', 2), mk('painkiller', 1)], loadout: { w1: mk('pistol'), w2: null, armor: null, bag: null, carry: [mk('ammo_9', 24), mk('bandage', 1)] }, xp: 0, stats: { raids: 0, extracts: 0, deaths: 0, kills: 0, earned: 0 }, quests: { progress: {}, done: [] }, unlocks: [] };
    this.persist();
  },
  load() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.loadout && s.stats) { s.quests = s.quests || { progress: {}, done: [] }; s.unlocks = s.unlocks || []; this.save = s; return; } } catch (e) { } this.newSave(); },
  persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.save)); } catch (e) { } },
  level() { return Math.floor(Math.sqrt(this.save.xp / 100)); },
  xpGain(n) { this.save.xp += n; this.raidXp = (this.raidXp || 0) + n; },
  // ----- raid lifecycle -----
  startRaid(mapId) {
    SFX.init(); SFX.startAmbient();
    const cfg = MAPS[mapId]; this.cfg = cfg; this.mapId = mapId; const L = this.save.loadout;
    const seed = Math.floor(Math.random() * 1e9); this.world = new World(cfg, seed); R.prerenderMap(this.world); this.explored = new Uint8Array(this.world.w * this.world.h); this.frameN = 0; R.mini = null; UI.mapOpen = false;
    const sp = this.world.spawn; this.player = new Player(sp.x * TILE + TILE / 2, sp.y * TILE + TILE / 2, { w1: L.w1 && { ...L.w1 }, w2: L.w2 && { ...L.w2 }, armor: L.armor && { ...L.armor }, bag: L.bag && { ...L.bag }, carry: L.carry });
    this.player.ang = Math.atan2(this.world.h / 2 * TILE - this.player.y, this.world.w / 2 * TILE - this.player.x);
    R.cam.x = this.player.x; R.cam.y = this.player.y;
    // spawn enemies
    this.enemies = []; this.bullets = []; this.particles = []; this.pings = []; this.toasts = []; this.time = 0; this.timeLeft = cfg.time; this.raidXp = 0; this.startValue = this.carriedValue();
    const spawns = this.world.enemySpawns.slice().sort(() => Math.random() - 0.5);
    const far = s => dist(s.x, s.y, this.player.x, this.player.y);
    const bldg = spawns.filter(s => s.home), roam = spawns.filter(s => !s.home);
    if (cfg.boss) { const b = bldg.slice().sort((a, b2) => far(b2) - far(a))[0]; if (b) { this.enemies.push(new Enemy(b.x, b.y, 'boss', b.home)); bldg.splice(bldg.indexOf(b), 1); this.enemies.push(new Enemy(b.x + 50, b.y, 'guard', b.home), new Enemy(b.x - 50, b.y, 'guard', b.home)); } }
    for (let i = 0; i < cfg.guards; i++) { const s = bldg.length ? bldg.splice(Math.floor(Math.random() * bldg.length), 1)[0] : roam.pop(); if (s) this.enemies.push(new Enemy(s.x, s.y, 'guard', s.home)); }
    for (let i = 0; i < cfg.scavs; i++) { const pool = (i % 2 === 0 && bldg.length) ? bldg : roam; const s = pool.length ? pool.splice(Math.floor(Math.random() * pool.length), 1)[0] : null; if (s) this.enemies.push(new Enemy(s.x + rand(-30, 30), s.y + rand(-30, 30), 'scav', s.home)); }
    this.save.stats.raids++; this.persist();
    this.state = 'raid'; UI.hide(); this.toast(cfg.name); setTimeout(() => this.toast('Stay quiet. Watch the rings.'), 2500);
  },
  extractOpen(e) { return this.time >= e.openAt && this.time < e.closeAt; },
  carriedValue() { const p = this.player; if (!p) return 0; let v = p.inv.reduce((a, i) => a + itemValue(i), 0); for (const wp of p.weapons) if (wp) v += itemValue(wp); if (p.armor) v += itemValue(p.armor); if (p.bag) v += itemValue(p.bag); return v; },
  extract(e) {

    const s = this.save; for (const i of items) UI.stashAdd({ ...i, uid: Math.floor(Math.random() * 1e9) }); s.loadout = { w1: null, w2: null, armor: null, bag: null, carry: [] };

  },
  onPlayerDeath(from) {
    if (this.state !== 'raid') return; const p = this.player; R.flashes = []; this.state = 'dying'; const items = [...p.inv, ...p.weapons.filter(Boolean)]; if (p.armor) items.push(p.armor); if (p.bag) items.push(p.bag);
    const value = this.carriedValue(); const s = this.save; s.loadout = { w1: null, w2: null, armor: null, bag: null, carry: [] }; s.stats.deaths++; s.stats.kills += p.kills;
    let charity = false; if (!s.stash.some(i => ITEMS[i.id].type === 'weapon') && s.money < buyPrice('pistol') + buyPrice('ammo_9')) { s.stash.push(mk('pistol'), mk('ammo_9', 24), mk('bandage', 1)); charity = true; }

    setTimeout(() => { if (this.player !== p) return; this.state = 'result'; UI.results(kind, { msg: from === 'timeout' ? 'The raid timer ran out. Nobody came looking.' : `Killed by ${from}.`, items, kills: p.kills, xp: this.raidXp, time: this.time, value, charity }); }, kind === 'mia' ? 100 : 1600);
  },
  // ----- helpers used by entities/render -----
  emitNoise(x, y, radius, src) { for (const e of this.enemies) if (e !== src) e.hear(x, y, radius, src); },
  flash(x, y, t) { R.flashes.push({ x, y, t }); },
  shake(a) { R.shake(a); },
  toast(msg) { this.toasts.unshift({ msg, t: 3.5 }); if (this.toasts.length > 4) this.toasts.pop(); },
  canPlayerSee(e) {
    const p = this.player; const d = dist(p.x, p.y, e.x, e.y); if (d > this.VIEW_LONG) return false;
    if (d > this.VIEW_SHORT * 0.9) { const a = Math.atan2(e.y - p.y, e.x - p.x); if (Math.abs(angleDiff(p.ang, a)) > this.CONE_HALF + 0.06) return false; }
    return this.world.los(p.x, p.y, e.x, e.y);
  },
  nearestContainer() { const p = this.player; let best = null, bd = 64; for (const c of this.world.containers) { const d = dist(p.x, p.y, c.x, c.y); if (d < bd) { bd = d; best = c; } } return best; },
  openLoot(c) { UI.loot(c); },
  objectiveMarkers() {
    const out = []; const w = this.world, s = this.save, ex = this.explored;
    const seen = (x, y) => ex[Math.floor(y / TILE) * w.w + Math.floor(x / TILE)];
    for (const e of w.extracts) out.push({ x: e.x, y: e.y, col: this.extractOpen(e) ? '#6f6' : '#f66', label: e.name + (this.extractOpen(e) ? '' : ' (closed)') });
    for (const npc of Object.keys(NPCS)) {
      const q = activeQuestFor(npc); if (!q || questReady(q)) continue;
      if (q.type === 'kill' && q.who === 'boss') { const b = this.enemies.find(e => e.type === 'boss'); if (b && b.home) out.push({ x: (b.home.x + b.home.w / 2) * TILE, y: (b.home.y + b.home.h / 2) * TILE, col: '#f4a', label: "The Drake's warehouse" }); }
      if (q.type === 'bring') { const want = q.items.map(i => i[0]); for (const c of w.containers) { if (c.searched || !seen(c.x, c.y) || c.type === 'body') continue; const table = LOOT[c.type]; if (table && table.some(t => want.includes(t[0]))) out.push({ x: c.x, y: c.y, col: '#fd4', label: CONTAINER_DEF[c.type].name }); } }
    }
    return out;
  },
  interact() {
    const p = this.player; if (p.dead) return; const c = this.nearestContainer(); if (!c) return;
    if (c.opened) { if (!c.items) c.items = rollLoot(c.type); UI.loot(c); } else if (!p.searching) p.searching = { c, t: 0 };
  },
  // ----- input -----
  bindInput() {
    const I = this.input; const cv = R.cv;
    window.addEventListener('keydown', e => {
      if (e.repeat) return; const k = e.key.toLowerCase(); I.keys.add(k); if (['tab', ' '].includes(k)) e.preventDefault();
      if (this.state !== 'raid') return;
      if (k === 'escape') { if (UI.mapOpen) UI.mapOpen = false; else if (UI.lootOpen || UI.invOpen || UI.menu) UI.hide(); else if (UI.paused) UI.hide(); else UI.pause(); }
      if (UI.paused) return;
      if (k === 'tab' || k === 'i') { if (UI.invOpen) UI.hide(); else { UI.hide(); UI.inventory(); } }
      if (k === 'e') { if (UI.lootOpen) UI.hide(); else this.interact(); }
      if (k === 'f') { this.player.light = !this.player.light; SFX.tick(); }
      if (k === 'c') this.player.checkMag();
      if (k === 'q') this.player.switchWeapon(); if (k === '1') this.player.switchWeapon(0); if (k === '2') this.player.switchWeapon(1);
      if (k === 'r') this.player.reload();
      if (k === 'm') UI.toggleMap();
      if (k >= '3' && k <= '6') { const meds = this.player.inv.filter(i => ITEMS[i.id].type === 'med'); const it = meds[+k - 3]; if (it) this.player.use(it); }
    });
    window.addEventListener('keyup', e => I.keys.delete(e.key.toLowerCase()));
    window.addEventListener('blur', () => I.keys.clear());
    window.addEventListener('mousemove', e => { I.mouse.x = e.clientX; I.mouse.y = e.clientY; });
    cv.addEventListener('mousedown', e => { SFX.init(); if (e.button === 0) I.mouse.down = true; if (e.button === 2) this.interact(); });
    window.addEventListener('mouseup', e => { if (e.button === 0) I.mouse.down = false; });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('wheel', e => { if (this.state === 'raid' && this.player) this.player.switchWeapon(); }, { passive: true });
    // touch
    const T2 = UI.touch; const findTouch = id => (T2.move && T2.move.id === id) ? 'move' : (T2.aim && T2.aim.id === id) ? 'aim' : null;
    cv.addEventListener('touchstart', e => {
      SFX.init(); e.preventDefault(); if (this.state !== 'raid') return;
      for (const t of e.changedTouches) {
        const x = t.clientX, y = t.clientY; let hit = false;
        for (const b of UI.touchLayout(R.W, R.H)) { if (dist(x, y, b.x, b.y) < b.r + 8) { hit = true; this.touchButton(b.id); break; } }
        if (hit) continue;
        if (x < R.W / 2 && !T2.move) T2.move = { id: t.identifier, ox: x, oy: y, dx: 0, dy: 0 };
        else if (x >= R.W / 2 && !T2.aim) T2.aim = { id: t.identifier, ox: x, oy: y, dx: 0, dy: 0, mag: 0 };
      }
    }, { passive: false });
    cv.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) { const k = findTouch(t.identifier); if (!k) continue; const s = T2[k]; let dx = (t.clientX - s.ox) / 60, dy = (t.clientY - s.oy) / 60; const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; } s.dx = dx; s.dy = dy; s.mag = Math.min(1, m); if (m > 0.2) s.ang = Math.atan2(dy, dx); } }, { passive: false });
    const endT = e => { for (const t of e.changedTouches) { const k = findTouch(t.identifier); if (k) T2[k] = null; } };
    cv.addEventListener('touchend', endT); cv.addEventListener('touchcancel', endT);
  },
  touchButton(id) {
    const p = this.player; if (!p) return;
    if (id === 'reload') p.reload(); if (id === 'swap') p.switchWeapon(); if (id === 'inv') { if (UI.invOpen) UI.hide(); else { UI.hide(); UI.inventory(); } }
    if (id === 'sprint') this.input.sprintToggle = !this.input.sprintToggle; if (id === 'interact') this.interact(); if (id === 'pause') { if (UI.paused) UI.hide(); else UI.pause(); }
    if (id === 'light') { p.light = !p.light; SFX.tick(); } if (id === 'map') UI.toggleMap(); if (id === 'check') p.checkMag();
  },
  readInput() {
    const I = this.input, k = I.keys, p = this.player, T2 = UI.touch; const inp = { mx: 0, my: 0, aim: p.ang, fire: false, fireHeld: false, sprint: false, reload: false };
    if (k.has('w') || k.has('arrowup')) inp.my -= 1; if (k.has('s') || k.has('arrowdown')) inp.my += 1; if (k.has('a') || k.has('arrowleft')) inp.mx -= 1; if (k.has('d') || k.has('arrowright')) inp.mx += 1;
    inp.sprint = k.has('shift');
    if (!IS_TOUCH || I.mouse.down) { const [wx, wy] = R.screenToWorld(I.mouse.x, I.mouse.y); if (!IS_TOUCH) inp.aim = Math.atan2(wy - p.y, wx - p.x); }
    if (I.mouse.down) { inp.fire = true; inp.fireHeld = I.mouse.wasDown; } I.mouse.wasDown = I.mouse.down;
    if (T2.move) { inp.mx = T2.move.dx; inp.my = T2.move.dy; }
    if (T2.aim) { if (T2.aim.ang !== undefined) inp.aim = T2.aim.ang; if (T2.aim.mag > 0.75) { inp.fire = true; inp.fireHeld = !!I.touchFiring; I.touchFiring = true; } else I.touchFiring = false; } else I.touchFiring = false;
    if (IS_TOUCH) inp.sprint = I.sprintToggle && (inp.mx || inp.my); if (IS_TOUCH && !(inp.mx || inp.my)) I.sprintToggle = false;
    if (UI.lootOpen || UI.invOpen) { inp.fire = false; }
    return inp;
  },
  // ----- loop -----
  loop(ts) {
    requestAnimationFrame(t => this.loop(t));
    let dt = Math.min(0.05, (ts - this.last) / 1000); this.last = ts;
    if (this.state === 'raid' || this.state === 'dying') { if (!UI.paused) this.update(dt); R.frame(dt); }
    else if (this.state === 'result' && this.world) { R.frame(0.0001); }
    else { const x = R.ctx; x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = '#14201a'; x.fillRect(0, 0, R.cv.width, R.cv.height); }
  },
  update(dt) {
    if (this.state !== 'raid' && this.state !== 'dying') return; const p = this.player, w = this.world; this.time += dt; this.timeLeft = this.cfg.time - this.time;
    SFX.listener.x = p.x; SFX.listener.y = p.y;
    if (this.timeLeft <= 0 && !p.dead) { p.dead = true; this.onPlayerDeath('timeout'); return; }
    const inp = this.readInput(); if (!p.dead) p.update(dt, inp);
    for (const e of this.enemies) e.update(dt, p);
    for (const b of this.bullets) b.update(dt); this.bullets = this.bullets.filter(b => !b.dead);
    for (const pt of this.particles) pt.update(dt); this.particles = this.particles.filter(pt => pt.life > 0);
    for (const pg of this.pings) pg.t -= dt; this.pings = this.pings.filter(pg => pg.t > 0);
    for (const t of this.toasts) t.t -= dt; this.toasts = this.toasts.filter(t => t.t > 0);
    // extract announcements
    for (const e of w.extracts) { if (!e._ann && this.time >= e.openAt && this.time < e.closeAt) { e._ann = true; if (this.time > 1) { this.toast(`${e.name} extract is OPEN`); SFX.chime(1); } } if (e._ann && !e._cl && this.time >= e.closeAt) { e._cl = true; this.toast(`${e.name} extract has CLOSED`); } }
    if (this.timeLeft < 60 && !this._warn) { this._warn = true; this.toast('ONE MINUTE LEFT'); }
  },
};
window.addEventListener('load', () => G.init());

</script>
