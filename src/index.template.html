<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Marsh Raid</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14201a; color: #eee; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  #game { display: block; position: fixed; inset: 0; cursor: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen:not(.hubscreen) { background: rgba(0,0,0,0.45); }
  .panel { background: #1f2a24; border: 3px solid #0d1410; border-radius: 14px; padding: 18px 20px; max-width: 760px; width: calc(100% - 24px); max-height: calc(100% - 24px); overflow: auto; box-shadow: 0 12px 40px #000a; position: relative; }
  .panel.inv, .panel.loot { max-width: 820px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: 3px; color: #f2d84a; text-shadow: 0 3px 0 #7a5a10; }
  h2 { margin: 0 0 10px; font-size: 18px; letter-spacing: 1px; color: #fff; display: flex; align-items: baseline; gap: 10px; }
  h2 small, h3 small { font-weight: normal; color: #9ab; font-size: 12px; }
  h3 { margin: 6px 0; font-size: 14px; color: #cde; display: flex; align-items: center; gap: 10px; }
  p { margin: 6px 0; line-height: 1.4; font-size: 14px; }
  .dim { color: #8a9a90; } .small { font-size: 12px; } .warn { color: #ffb347; font-weight: bold; }
  .money { color: #f2d84a; font-weight: bold; font-size: 18px; }
  .b { background: #3b5a44; color: #fff; border: 2px solid #142a1a; border-bottom-width: 4px; border-radius: 8px; padding: 6px 12px; font-weight: bold; font-size: 13px; cursor: pointer; margin: 2px; font-family: inherit; }
  .b:active { transform: translateY(2px); border-bottom-width: 2px; }
  .b.go { background: #d9a520; color: #2a1a00; border-color: #7a5a10; font-size: 16px; padding: 10px 20px; }
  .b.sell { background: #6a3a3a; border-color: #2a1414; }
  .b.dis { opacity: 0.45; }
  .b.x { position: absolute; right: 12px; top: 12px; background: #5a2a2a; }
  .b.icon { padding: 4px 8px; }
  .b.link { background: none; border: none; color: #8a9a90; text-decoration: underline; font-weight: normal; padding: 0; }
  .hub { width: 100%; height: 100%; display: flex; flex-direction: column; background: linear-gradient(#1b2a22, #0f1a14); padding: 12px 14px; gap: 8px; }
  .hub header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .hub .meta { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .tabs { display: none; gap: 4px; }
  .tab { flex: 1; background: #22332a; color: #9ab; border: 2px solid #0d1410; border-radius: 8px; padding: 8px 4px; font-weight: bold; font-size: 12px; font-family: inherit; }
  .tab.on { background: #3b5a44; color: #fff; }
  .cols { display: flex; gap: 12px; flex: 1; min-height: 0; }
  .cols section { flex: 1; background: #1f2a24; border: 3px solid #0d1410; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .list { overflow: auto; flex: 1; min-height: 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-bottom: 1px solid #0d141066; font-size: 13px; }
  .row:hover { background: #ffffff08; }
  .row .nm { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .row .nm small { color: #8a9a90; width: 100%; font-size: 11px; }
  .row .vl { color: #f2d84a; white-space: nowrap; font-size: 12px; }
  .row .acts { white-space: nowrap; }
  .row.lock { opacity: 0.5; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 2px solid #0008; flex: none; }
  .slot { background: #16201a; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .slot b { color: #9ab; width: 84px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  .slot span { flex: 1; display: flex; align-items: center; gap: 8px; }
  .slot.act { outline: 2px solid #f2d84a; }
  .maps { display: flex; flex-direction: column; gap: 8px; overflow: auto; }
  .map { background: #16201a; border-left: 6px solid; border-radius: 8px; padding: 10px 12px; }
  .map b { font-size: 16px; } .map small { color: #9ab; margin-left: 8px; } .map p { font-size: 12px; margin: 4px 0; }
  .npc { background: #16201a; border-left: 6px solid; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .npc .nh { display: flex; align-items: center; gap: 8px; } .npc .nh small { color: #9ab; } .npc .qt { color: #f2d84a; display: block; margin-top: 6px; }
  .two { display: flex; gap: 14px; } .two > div { flex: 1; min-width: 0; display: flex; flex-direction: column; max-height: 60vh; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0; font-size: 13px; color: #9ab; } .stats b { color: #fff; font-size: 16px; margin-left: 4px; }
  .res .list { max-height: 30vh; }
  footer { font-size: 12px; text-align: center; }
  @media (max-width: 1000px) {
    .tabs { display: flex; }
    .cols section { display: none; } .cols section.on { display: flex; }
    .hub { padding: 8px; } h1 { font-size: 20px; } .hub .meta { font-size: 12px; gap: 10px; }
    .two { flex-direction: column; } .two > div { max-height: 34vh; }
    footer { display: none; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script>
/*__GAME__*/
</script>
</body>
</html>
